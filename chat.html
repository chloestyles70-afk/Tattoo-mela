<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat — Tattoo</title>

  <style>
    :root {
      --bg: #0d0b10;
      --panel: #17131b;
      --panel-soft: #211a23;
      --text: #f8f2f5;
      --muted: #b9adb5;
      --accent: #e9a8c4;
      --accent-dark: #d98faf;
      --line: rgba(255,255,255,.10);
      --shadow: rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(233,168,196,.12),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* APP */

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      margin: auto;
      background: rgba(13,11,16,.94);
      position: relative;
      overflow: hidden;
    }

    /* HEADER */

    .topbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 700px;
      height: 72px;
      z-index: 20;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 10px 15px;

      background: rgba(23,19,27,.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid var(--line);
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,.06);
      color: var(--text);

      display: grid;
      place-items: center;

      font-size: 18px;

      transition: .2s;
    }

    .icon-btn:hover {
      background: rgba(233,168,196,.16);
      transform: scale(1.05);
    }

    .profile {
      flex: 1;

      display: flex;
      align-items: center;
      gap: 10px;

      cursor: pointer;
    }

    .avatar {
      width: 43px;
      height: 43px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #e9a8c4,
          #b96d8e
        );

      color: #24151d;
      font-weight: bold;
      font-size: 18px;

      box-shadow:
        0 0 0 3px rgba(233,168,196,.08),
        0 5px 18px rgba(0,0,0,.25);
    }

    .profile-info strong {
      display: block;
      font-size: 15px;
    }

    .status {
      color: #d7bfc9;
      font-size: 12px;
      margin-top: 2px;
    }

    .online-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ed6b0;
      margin-right: 4px;
    }

    /* MESSAGES */

    .message-list {
      min-height: 100vh;
      padding: 90px 16px 130px;
      overflow-y: auto;
    }

    .date-divider {
      text-align: center;
      margin: 10px 0 22px;

      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .row {
      display: flex;
      margin: 8px 0;
      animation: bubbleIn .25s ease;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.them {
      justify-content: flex-start;
    }

    .bubble {
      position: relative;

      max-width: 78%;

      padding: 11px 15px;

      border-radius: 20px;

      font-size: 15px;
      line-height: 1.5;

      word-wrap: break-word;

      box-shadow:
        0 5px 18px rgba(0,0,0,.18);

      transition: transform .2s;
    }

    .bubble:hover {
      transform: translateY(-1px);
    }

    .row.them .bubble {
      background: #211a23;
      color: var(--text);

      border: 1px solid rgba(233,168,196,.12);

      border-bottom-left-radius: 6px;
    }

    .row.me .bubble {
      background:
        linear-gradient(
          135deg,
          #e9a8c4,
          #d98faf
        );

      color: #24151d;

      border-bottom-right-radius: 6px;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 5px;

      margin-top: 5px;

      font-family: Arial, sans-serif;
      font-size: 9px;

      opacity: .65;
    }

    .row.me .message-meta {
      justify-content: flex-end;
    }

    .checks {
      letter-spacing: -3px;
    }

    /* MEDIA */

    .media-bubble {
      padding: 4px;
      overflow: hidden;
      border-radius: 20px;
    }

    .media-bubble img,
    .media-bubble video {
      display: block;

      max-width: 240px;
      max-height: 300px;

      border-radius: 16px;

      object-fit: cover;
    }

    /* TYPING */

    .typing-row {
      display: none;
      margin: 8px 0;
    }

    .typing-row.show {
      display: flex;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 4px;

      padding: 12px 15px;

      background: #211a23;

      border-radius: 20px;
      border-bottom-left-radius: 6px;
    }

    .typing-bubble span {
      width: 6px;
      height: 6px;

      background: var(--accent);

      border-radius: 50%;

      animation: typingDot 1.2s infinite ease-in-out;
    }

    .typing-bubble span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-bubble span:nth-child(3) {
      animation-delay: .3s;
    }

    /* COMPOSER */

    .composer {
      position: fixed;

      bottom: 0;
      left: 50%;
      transform: translateX(-50%);

      width: 100%;
      max-width: 700px;

      z-index: 20;

      padding: 10px 12px 14px;

      background: rgba(23,19,27,.96);
      backdrop-filter: blur(18px);

      border-top: 1px solid var(--line);
    }

    .composer-inner {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-wrap {
      flex: 1;

      display: flex;
      align-items: center;

      min-height: 46px;

      padding: 4px 6px 4px 15px;

      background: #211a23;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 24px;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #8f828b;
    }

    .send-btn {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: var(--accent);

      color: #24151d;

      display: grid;
      place-items: center;

      font-size: 16px;

      transition: .2s;
    }

    .send-btn:hover {
      transform: scale(1.08);
      background: #f1bad1;
    }

    .small-btn {
      width: 34px;
      height: 34px;

      border: none;
      background: transparent;

      color: var(--muted);

      border-radius: 50%;

      font-size: 18px;
    }

    .small-btn:hover {
      background: rgba(233,168,196,.10);
      color: var(--accent);
    }

    /* EMOJI */

    .emoji-panel {
      display: none;

      position: absolute;

      bottom: 76px;
      right: 12px;

      width: 280px;

      padding: 14px;

      background: #211a23;

      border: 1px solid var(--line);

      border-radius: 18px;

      box-shadow: 0 15px 40px var(--shadow);
    }

    .emoji-panel.show {
      display: block;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .emoji {
      border: none;
      background: transparent;

      font-size: 22px;

      padding: 5px;
      border-radius: 8px;
    }

    .emoji:hover {
      background: rgba(233,168,196,.12);
    }

    /* ATTACHMENT */

    #fileInput {
      display: none;
    }

    .attachment-preview {
      display: none;

      margin-bottom: 8px;

      padding: 8px;

      background: #211a23;

      border-radius: 14px;
    }

    .attachment-preview.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .attachment-preview img,
    .attachment-preview video {
      width: 55px;
      height: 55px;

      object-fit: cover;

      border-radius: 10px;
    }

    .remove-file {
      margin-left: auto;

      border: none;

      background: transparent;

      color: #d99ab5;

      font-size: 18px;
    }

    /* POPUPS */

    .overlay {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 50;

      background: rgba(0,0,0,.65);

      align-items: flex-end;
      justify-content: center;
    }

    .overlay.show {
      display: flex;
    }

    .popup {
      width: 100%;
      max-width: 700px;

      background: #17131b;

      border-radius: 24px 24px 0 0;

      padding: 24px;

      border-top: 1px solid var(--line);

      box-shadow: 0 -10px 40px rgba(0,0,0,.4);

      animation: popupIn .25s ease;
    }

    .popup h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .popup p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .popup-input {
      width: 100%;

      padding: 13px 15px;

      border-radius: 14px;

      border: 1px solid var(--line);

      outline: none;

      background: #211a23;

      color: var(--text);

      margin-bottom: 12px;
    }

    .popup-btn {
      width: 100%;

      border: none;

      padding: 13px;

      border-radius: 14px;

      background: var(--accent);

      color: #24151d;

      margin-top: 8px;
    }

    .popup-btn.secondary {
      background: rgba(255,255,255,.07);
      color: var(--text);
    }

    .popup-list {
      display: grid;
      gap: 8px;
    }

    .popup-list button {
      width: 100%;
      padding: 13px;

      border: none;
      border-radius: 14px;

      background: rgba(255,255,255,.06);
      color: var(--text);

      text-align: left;
    }

    .popup-list button:hover {
      background: rgba(233,168,196,.12);
    }

    /* EMPTY */

    .empty {
      text-align: center;
      padding: 80px 25px;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 20px;
      margin-bottom: 8px;
    }

    /* ANIMATIONS */

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes typingDot {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .45;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .bubble {
        max-width: 82%;
        font-size: 14px;
        padding: 10px 14px;
      }

      .media-bubble img,
      .media-bubble video {
        max-width: 220px;
      }

      .emoji-panel {
        width: calc(100% - 24px);
        right: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   TATTOO CHAT
   SUPABASE + REALTIME
   ONLY YOU AND MELA
===================================================== */


/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
  "https://mtlesmajgaxiaebocybz.supabase.co";

const SUPABASE_KEY =
  "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   SETTINGS
===================================================== */

const ROOM_ID = "tattoo";

const STORAGE_IDENTITY =
  "tattoo_chat_identity";


/* =====================================================
   ELEMENTS
===================================================== */

const messageList =
  document.getElementById("messageList");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const attachmentButton =
  document.getElementById("attachmentButton");

const fileInput =
  document.getElementById("fileInput");

const attachmentPreview =
  document.getElementById("attachmentPreview");

const attachmentContent =
  document.getElementById("attachmentContent");

const removeFileButton =
  document.getElementById("removeFileButton");

const emojiButton =
  document.getElementById("emojiButton");

const emojiPanel =
  document.getElementById("emojiPanel");

const typingRow =
  document.getElementById("typingRow");

const emptyState =
  document.getElementById("emptyState");

const statusText =
  document.getElementById("statusText");


/* =====================================================
   IDENTITY
===================================================== */

let identity =
  localStorage.getItem(STORAGE_IDENTITY);

if (
  identity !== "you" &&
  identity !== "mela"
) {

  const answer =
    confirm(
      "Are you Mela?\n\nOK = Mela\nCancel = You"
    );

  identity =
    answer ? "mela" : "you";

  localStorage.setItem(
    STORAGE_IDENTITY,
    identity
  );
}


const currentUser =
  identity === "mela"
    ? "mela"
    : "you";

const currentName =
  identity === "mela"
    ? "Mela"
    : "You";


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatTime(date) {

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
}


function scrollToBottom() {

  setTimeout(() => {

    messageList.scrollTop =
      messageList.scrollHeight;

  }, 50);
}


function updateEmptyState() {

  const messages =
    messageList.querySelectorAll(".row");

  emptyState.style.display =
    messages.length === 0
      ? "block"
      : "none";
}


/* =====================================================
   RENDER TEXT MESSAGE
===================================================== */

function renderMessage(message) {

  const row =
    document.createElement("div");

  const isMine =
    message.sender_id === currentUser;

  row.className =
    "row " +
    (isMine ? "me" : "them");

  row.dataset.messageId =
    message.id;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if (
    message.message_type === "image" &&
    message.media_path
  ) {

    bubble.classList.add(
      "media-bubble"
    );

    bubble.innerHTML = `
      <img
        src="${escapeHTML(message.media_path)}"
        alt="Photo"
      >

      <div class="message-meta">
        ${formatTime(message.created_at)}
        ${isMine ? '<span class="checks">✓✓</span>' : ""}
      </div>
    `;

  } else if (
    message.message_type === "video" &&
    message.media_path
  ) {

    bubble.classList.add(
      "media-bubble"
    );

    bubble.innerHTML = `
      <video
        src="${escapeHTML(message.media_path)}"
        controls
        playsinline
      ></video>

      <div class="message-meta">
        ${formatTime(message.created_at)}
        ${isMine ? '<span class="checks">✓✓</span>' : ""}
      </div>
    `;

  } else {

    bubble.innerHTML = `
      <div>
        ${escapeHTML(message.content)}
      </div>

      <div class="message-meta">
        ${formatTime(message.created_at)}
        ${
          isMine
            ? '<span class="checks">✓✓</span>'
            : ""
        }
      </div>
    `;
  }

  row.appendChild(bubble);

  messageList.insertBefore(
    row,
    typingRow
  );

  updateEmptyState();
}


/* =====================================================
   LOAD OLD MESSAGES
===================================================== */

async function loadMessages() {

  const {
    data,
    error
  } = await supabaseClient
    .from("chat_messages")
    .select("*")
    .eq("room_id", ROOM_ID)
    .order(
      "created_at",
      {
        ascending: true
      }
    );

  if (error) {

    console.error(
      "Message loading error:",
      error
    );

    statusText.textContent =
      "Connection problem";

    return;
  }

  messageList
    .querySelectorAll(".row")
    .forEach(
      row => row.remove()
    );

  data.forEach(
    renderMessage
  );

  updateEmptyState();

  scrollToBottom();

  markMessagesRead();
}


/* =====================================================
   SEND TEXT
===================================================== */

async function sendText() {

  const content =
    messageInput.value.trim();

  if (!content) {
    return;
  }

  sendButton.disabled = true;

  const {
    error
  } = await supabaseClient
    .from("chat_messages")
    .insert({
      room_id: ROOM_ID,
      sender_id: currentUser,
      sender_name: currentName,
      content: content,
      message_type: "text"
    });

  sendButton.disabled = false;

  if (error) {

    console.error(
      "Send error:",
      error
    );

    alert(
      "The message could not be sent."
    );

    return;
  }

  messageInput.value = "";

  emojiPanel.classList.remove(
    "show"
  );
}


/* =====================================================
   FORM
===================================================== */

messageForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    await sendText();
  }
);


/* =====================================================
   REALTIME MESSAGES
===================================================== */

supabaseClient
  .channel(
    "tattoo-chat-room"
  )
  .on(
    "postgres_changes",
    {
      event: "INSERT",
      schema: "public",
      table: "chat_messages",
      filter:
        "room_id=eq.tattoo"
    },
    payload => {

      const message =
        payload.new;

      if (
        document.querySelector(
          `[data-message-id="${message.id}"]`
        )
      ) {
        return;
      }

      renderMessage(message);

      scrollToBottom();

      if (
        message.sender_id !== currentUser
      ) {

        markMessagesRead();
      }
    }
  )
  .on(
    "postgres_changes",
    {
      event: "UPDATE",
      schema: "public",
      table: "chat_messages",
      filter:
        "room_id=eq.tattoo"
    },
    () => {

      loadMessages();
    }
  )
  .subscribe(
    status => {

      if (status === "SUBSCRIBED") {

        statusText.textContent =
          "Connected";

      } else {

        statusText.textContent =
          "Connecting...";
      }
    }
  );


/* =====================================================
   READ RECEIPTS
===================================================== */

async function markMessagesRead() {

  const {
    data
  } = await supabaseClient
    .from("chat_messages")
    .select("id")
    .eq("room_id", ROOM_ID)
    .neq("sender_id", currentUser)
    .is("read_at", null);

  if (!data || !data.length) {
    return;
  }

  for (
    const message
    of data
  ) {

    await supabaseClient
      .from("chat_messages")
      .update({
        read_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        message.id
      );
  }
}

   EMOJI
===================================================== */

emojiButton.addEventListener(

    );
  }
);


document

/* =====================================================
   ATTACHMENTS
===================================================== */

let selectedFile = null;


attachmentButton.addEventListener(
  "click",
  function() {

    fileInput.click();
  }
);


fileInput.addEventListener(
  "change",
  function() {

    const file =
      fileInput.files[0];

    if (!file) {
      return;
    }

    selectedFile = file;

    attachmentPreview
      .classList.add("show");

    if (
      file.type.startsWith("image/")
    ) {

      const url =
        URL.createObjectURL(file);

      attachmentContent.innerHTML = `
        <img
          src="${url}"
          alt="Selected photo"
        >
      `;

    } else {

      const url =
        URL.createObjectURL(file);

      attachmentContent.innerHTML = `
        <video
          src="${url}"
          muted
        ></video>
      `;
    }
  }
);


removeFileButton.addEventListener(
  "click",
  function() {

    selectedFile = null;

    fileInput.value = "";

    attachmentPreview
      .classList.remove("show");

    attachmentContent.innerHTML = "";
  }
);


/* =====================================================
   UPLOAD MEDIA
===================================================== */

async function uploadMedia() {

  if (!selectedFile) {
    return;
  }

  const extension =
    selectedFile.name
      .split(".")
      .pop();

  const filePath =
    `${currentUser}/${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}.${extension}`;

  const {
    error: uploadError
  } = await supabaseClient
    .storage
    .from("tattoo-chat-media")
    .upload(
      filePath,
      selectedFile,
      {
        upsert: false
      }
    );

  if (uploadError) {

    console.error(
      "Upload error:",
      uploadError
    );

    alert(
      "The photo/video could not be uploaded."
    );

    return;
  }

  const {
    data
  } = supabaseClient
    .storage
    .from("tattoo-chat-media")
    .getPublicUrl(
      filePath
    );

  const messageType =
    selectedFile.type.startsWith("image/")
      ? "image"
      : "video";

  const {
    error
  } = await supabaseClient
    .from("chat_messages")
    .insert({

      room_id: ROOM_ID,

      sender_id: currentUser,

      sender_name: currentName,

      content:
        messageType === "image"
          ? "Photo"
          : "Video",

      message_type:
        messageType,

      media_path:
        data.publicUrl
    });

  if (error) {

    console.error(
      "Media message error:",
      error
    );

    alert(
      "The media message could not be created."
    );

    return;
  }

  selectedFile = null;

  fileInput.value = "";

  attachmentPreview
    .classList.remove("show");

  attachmentContent.innerHTML = "";
}

   ATTACHMENT + TEXT
===================================================== */

messageForm.addEventListener(

  async function(event) {

    event.preventDefault();

    if (selectedFile) {

      await uploadMedia();

      return;
    }

    await sendText();
  }
);

   SEARCH
===================================================== */

const searchOverlay =
  document.getElementById(
    "searchOverlay"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    function() {

        .classList.add("show");

      searchInput.focus();
    }
  );


document
  .getElementById("closeSearch")
  .addEventListener(
    "click",
    function() {

      searchOverlay
        .classList.remove("show");
    }
  );


document
  .getElementById("searchSubmit")
  .addEventListener(
    "click",
    function() {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();

      if (!query) {
        return;
      }

      const rows =
        messageList
          .querySelectorAll(".row");

      let found = false;

      rows.forEach(row => {

        const text =
          row.textContent
            .toLowerCase();

        if (
          text.includes(query)
        ) {

          row.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

          found = true;
        }
      });

      if (!found) {

        alert(
          "I couldn't find that message."
        );
      }

      searchOverlay
        .classList.remove("show");
    }
  );

/* =====================================================
   SAVE CONVERSATION
===================================================== */

document
  .getElementById("saveConversation")
  .addEventListener(
    "click",
    async function() {

      const {
        data
      } = await supabaseClient
        .from("chat_messages")
        .select("*")
        .eq("room_id", ROOM_ID)
        .order(
          "created_at",
          {
            ascending: true
          }
        );

      if (!data) {
        return;
      }

      let text =
        "TATTOO — OUR CHAT\n\n";

      data.forEach(message => {

        text +=
          `${message.sender_name} — ` +
          `${formatTime(message.created_at)}\n`;

        if (
          message.message_type === "text"
        ) {

          text +=
            `${message.content}\n\n`;

        } else {

          text +=
            `[${message.message_type}]\n\n`;
        }
      });

      const blob =
        new Blob(
          [text],
          {
            type: "text/plain"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "tattoo-our-chat.txt";

      link.click();

      URL.revokeObjectURL(url);

      moreOverlay
        .classList.remove("show");
    }
  );


/* =====================================================
   CLEAR MY MESSAGES
===================================================== */

document
  .getElementById("clearMyMessages")
  .addEventListener(
    "click",
    async function() {

      const confirmed =
        confirm(
          "Delete all of your messages from this chat?"
        );

      if (!confirmed) {
        return;
      }

      const {
        error
      } = await supabaseClient
        .from("chat_messages")
        .delete()
        .eq(
          "room_id",
          ROOM_ID
        )
        .eq(
          "sender_id",
          currentUser
        );

      if (error) {

        console.error(
          "Delete error:",
          error
        );

        alert(
          "The messages could not be deleted."
        );

        return;
      }

      await loadMessages();

      moreOverlay
        .classList.remove("show");
    }
  );

===================================================== */

===================================================== */

        ) {

          overlay.classList.remove(
            "show"
          );
        }
      }
    );

  });


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      document
        .querySelectorAll(".overlay")
        .forEach(
          overlay =>
            overlay.classList.remove(
              "show"
            )
        );

      emojiPanel.classList.remove(
        "show"
      );
    }
  }
);

loadMessages();
