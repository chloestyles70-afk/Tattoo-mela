<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0d0b10" />

  <title>Our Little World — Chat</title>

  <link rel="stylesheet" href="style.css" />

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0b10;
      color: #f8f2f5;
      font-family: Georgia, "Times New Roman", serif;
    }

    .chat-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(233,168,196,.12),
          transparent 38%
        ),
        #0d0b10;
    }


    /* HEADER */

    .chat-header {
      padding: 24px 18px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(13,11,16,.85);
      backdrop-filter: blur(15px);
    }

    .chat-eyebrow {
      color: #e9a8c4;
      font: 10px Arial, sans-serif;
      letter-spacing: 2.5px;
      margin-bottom: 7px;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 29px;
      font-weight: normal;
    }

    .chat-header p {
      margin: 7px 0 0;
      color: #b9adb5;
      font: 13px/1.5 Arial, sans-serif;
    }


    /* NAVIGATION */

    .chat-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 17px;
    }

    .chat-nav a {
      color: #b9adb5;
      text-decoration: none;
      font: 11px Arial, sans-serif;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px;
      transition: .2s ease;
    }

    .chat-nav a:hover {
      color: #f8f2f5;
      border-color: rgba(233,168,196,.45);
    }

    .chat-nav a.active {
      color: #241720;
      background: #e9a8c4;
      border-color: #e9a8c4;
    }


    /* CHAT */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 17px 125px;
      scroll-behavior: smooth;
    }

    .date-divider {
      text-align: center;
      margin: 8px 0 22px;
      color: #8f858c;
      font: 10px Arial, sans-serif;
      letter-spacing: 1px;
    }

    .message-row {
      display: flex;
      margin-bottom: 17px;
    }

    .message-row.me {
      justify-content: flex-end;
    }

    .message-row.them {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 19px;
      line-height: 1.5;
      font-size: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,.15);
    }

    .them .bubble {
      background: #17131b;
      border: 1px solid rgba(255,255,255,.09);
      border-bottom-left-radius: 5px;
    }

    .me .bubble {
      background: rgba(233,168,196,.19);
      border: 1px solid rgba(233,168,196,.24);
      border-bottom-right-radius: 5px;
    }

    .message-name {
      display: block;
      margin-bottom: 5px;
      color: #e9a8c4;
      font: 9px Arial, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .message-time {
      display: block;
      margin-top: 6px;
      color: #81767e;
      font: 9px Arial, sans-serif;
      text-align: right;
    }


    /* EMPTY / WELCOME */

    .welcome {
      text-align: center;
      max-width: 330px;
      margin: 15px auto 28px;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      background: rgba(23,19,27,.55);
    }

    .welcome-heart {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .welcome h2 {
      margin: 0 0 7px;
      font-size: 18px;
      font-weight: normal;
    }

    .welcome p {
      margin: 0;
      color: #b9adb5;
      font: 12px/1.6 Arial, sans-serif;
    }


    /* INPUT */

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(13,11,16,.92);
      border-top: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(18px);
    }

    .composer {
      max-width: 700px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      height: 47px;
      padding: 0 17px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,.12);
      outline: none;
      background: #17131b;
      color: #f8f2f5;
      font: 15px Georgia, "Times New Roman", serif;
    }

    .composer input::placeholder {
      color: #81767e;
    }

    .composer input:focus {
      border-color: rgba(233,168,196,.45);
    }

    .send-btn {
      flex: 0 0 47px;
      width: 47px;
      height: 47px;
      border: 0;
      border-radius: 50%;
      background: #e9a8c4;
      color: #241720;
      font-size: 19px;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .send-btn:active {
      transform: scale(.92);
    }


    /* MOBILE */

    @media (max-width: 480px) {

      .chat-header {
        padding-top: 20px;
      }

      .chat-header h1 {
        font-size: 26px;
      }

      .bubble {
        max-width: 84%;
        font-size: 14px;
      }

      .messages {
        padding-left: 13px;
        padding-right: 13px;
      }

    }

  </style>
</head>


<body>

  <main class="chat-page">


    <!-- HEADER -->

    <header class="chat-header">

      <div class="chat-eyebrow">
        OUR LITTLE WORLD
      </div>

      <h1>
        Chat
      </h1>

      <p>
        Just us. No noise.
      </p>


      <nav class="chat-nav">

        <a href="index.html">
          Tattoo
        </a>

        <a
          href="chat.html"
          class="active"
        >
          Chat
        </a>

        <a href="memories.html">
          Memories
        </a>

      </nav>

    </header>


    <!-- MESSAGES -->

    <section
      class="messages"
      id="messages"
    >

      <div class="welcome">

        <div class="welcome-heart">
          ♡
        </div>

        <h2>
          Welcome to our little space.
        </h2>

        <p>
          Say whatever you want here.
          The random thoughts, the good days,
          the bad days, and everything in between.
        </p>

      </div>


      <div class="date-divider">
        TODAY
      </div>


      <div class="message-row them">

        <div class="bubble">

          <span class="message-name">
            Mela
          </span>

          Hey ❤️

          <span class="message-time">
            now
          </span>

        </div>

      </div>


      <div class="message-row me">

        <div class="bubble">

          <span class="message-name">
            Alfred
          </span>

          This is our little space.

          <span class="message-time">
            now
          </span>

        </div>

      </div>

    </section>


    <!-- MESSAGE COMPOSER -->

    <div class="composer-wrap">

      <form
        class="composer"
        id="chatForm"
      >

        <input
          id="messageInput"
          type="text"
          placeholder="Write something..."
          autocomplete="off"
          maxlength="1000"
        />

        <button
          class="send-btn"
          type="submit"
          aria-label="Send message"
        >
          ↑
        </button>

      </form>

    </div>

  </main>


  <script>

    const form =
      document.getElementById("chatForm");

    const input =
      document.getElementById("messageInput");

    const messages =
      document.getElementById("messages");


    function addMessage(text) {

      const row =
        document.createElement("div");

      row.className =
        "message-row me";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      const name =
        document.createElement("span");

      name.className =
        "message-name";

      name.textContent =
        "Alfred";


      const message =
        document.createTextNode(text);


      const time =
        document.createElement("span");

      time.className =
        "message-time";

      time.textContent =
        "now";


      bubble.appendChild(name);
      bubble.appendChild(message);
      bubble.appendChild(time);

      row.appendChild(bubble);

      messages.appendChild(row);

      messages.scrollTop =
        messages.scrollHeight;

    }


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        const text =
          input.value.trim();

        if (!text) return;

        addMessage(text);

        input.value = "";

        input.focus();

      }
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          form.requestSubmit();

        }

      }
    );


    messages.scrollTop =
      messages.scrollHeight;

  </script>

</body>

</html>
