<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Tattoo — Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0d0b10;
      --panel: #17131b;
      --panel-soft: #211a23;
      --bubble-me: #e9a8c4;
      --bubble-them: #28212b;
      --text: #f8f2f5;
      --muted: #b9adb5;
      --accent: #e9a8c4;
      --line: rgba(255,255,255,.10);
      --shadow: rgba(0,0,0,.40);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(233,168,196,.12),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      height: 74px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(23,19,27,.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 5px 20px var(--shadow);
      z-index: 10;
    }

    .back-btn,
    .header-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: .2s;
    }

    .back-btn:hover,
    .header-btn:hover {
      background: rgba(233,168,196,.18);
    }

    .profile {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#e9a8c4,#b87599);
      color: #24151e;
      font-weight: bold;
      font-size: 19px;
      box-shadow: 0 4px 16px rgba(233,168,196,.25);
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      font-size: 16px;
      font-weight: bold;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .status.online {
      color: #b8e6c8;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    /* MESSAGES */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 110px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(233,168,196,.25);
      border-radius: 20px;
    }

    .date-divider {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      margin: 6px 0 20px;
    }

    .row {
      display: flex;
      margin: 7px 0;
      animation: appear .18s ease;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.them {
      justify-content: flex-start;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-wrap {
      max-width: min(78%, 520px);
    }

    .bubble {
      padding: 10px 13px;
      border-radius: 20px;
      line-height: 1.45;
      font-size: 15px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    .me .bubble {
      background: var(--bubble-me);
      color: #2a1720;
      border-bottom-right-radius: 7px;
    }

    .them .bubble {
      background: var(--bubble-them);
      color: var(--text);
      border-bottom-left-radius: 7px;
      border: 1px solid var(--line);
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      padding: 0 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .me .message-meta {
      justify-content: flex-end;
    }

    .checks {
      letter-spacing: -2px;
      color: var(--muted);
    }

    .checks.read {
      color: #9fd5ff;
    }

    .media {
      max-width: 100%;
      max-height: 340px;
      border-radius: 15px;
      display: block;
      margin-bottom: 5px;
    }

    .file-caption {
      margin-top: 6px;
    }

    /* TYPING */

    .typing {
      display: none;
      padding: 0 18px 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .typing.show {
      display: block;
    }

    .typing-dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 3px;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: dot 1s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes dot {
      0%,100% {
        opacity: .3;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding:
        8px 10px
        calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(
        to top,
        rgba(13,11,16,1),
        rgba(13,11,16,.95)
      );
      z-index: 20;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 7px 25px var(--shadow);
    }

    .composer-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      display: grid;
      place-items: center;
    }

    .composer-btn:hover {
      color: var(--accent);
      background: rgba(233,168,196,.10);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 8px 2px;
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #887c85;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #281720;
      font-size: 18px;
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    /* EMOJI */

    .emoji-panel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 70px;
      max-width: 900px;
      margin: auto;
      display: none;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 35px var(--shadow);
      z-index: 30;
    }

    .emoji-panel.show {
      display: block;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8,1fr);
      gap: 5px;
    }

    .emoji {
      background: transparent;
      color: white;
      font-size: 23px;
      padding: 5px;
      border-radius: 10px;
    }

    .emoji:hover {
      background: rgba(233,168,196,.12);
    }

    /* POPUPS */

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.62);
      z-index: 100;
    }

    .overlay.show {
      display: flex;
    }

    .popup {
      width: min(430px,100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.5);
    }

    .popup h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .popup p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .popup input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 13px;
      border: 1px solid var(--line);
      outline: none;
      background: var(--panel-soft);
      color: white;
    }

    .popup-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .popup-actions button {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      color: white;
    }

    .popup-actions .primary {
      background: var(--accent);
      color: #291720;
    }

    .menu-list {
      display: grid;
      gap: 8px;
    }

    .menu-item {
      width: 100%;
      text-align: left;
      padding: 13px;
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      color: white;
    }

    .menu-item:hover {
      background: rgba(233,168,196,.13);
    }

    /* IDENTITY */

    .identity-options {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .identity-option {
      padding: 15px;
      border-radius: 15px;
      background: rgba(255,255,255,.06);
      color: white;
      text-align: left;
      border: 1px solid transparent;
    }

    .identity-option:hover {
      border-color: rgba(233,168,196,.45);
    }

    /* JUMP */

    .jump-btn {
      position: fixed;
      right: 15px;
      bottom: 82px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--panel);
      color: var(--accent);
      border: 1px solid var(--line);
      display: none;
      z-index: 15;
    }

    .jump-btn.show {
      display: grid;
      place-items: center;
    }

    /* ATTACHMENT */

    .attachment-preview {
      display: none;
      max-width: 900px;
      margin: 0 auto 6px;
      padding: 7px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .attachment-preview.show {
      display: flex;
    }

    .attachment-name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 12px;
    }

    .remove-attachment {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: white;
    }

    @media (max-width:600px) {

      .header {
        height: 68px;
        padding: 8px 10px;
      }

      .header-btn,
      .back-btn {
        width: 38px;
        height: 38px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .header-actions {
        gap: 2px;
      }

      .message-wrap {
        max-width: 84%;
      }

      .bubble {
        font-size: 14px;
      }

      .emoji-grid {
        grid-template-columns: repeat(7,1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

<!-- COMPOSER -->

<div class="composer-area">

<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://mtlesmajgaxiaebocybz.supabase.co";

  const SUPABASE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     SETTINGS
  ===================================================== */

  const ROOM_ID =
    "tattoo";

  const BUCKET =
    "tattoo-chat-media";


  /* =====================================================
     IDENTITY
  ===================================================== */

  let currentUser =
    localStorage.getItem(
      "tattoo_user"
    );

  if (!currentUser) {

    currentUser =
      "you";

    localStorage.setItem(
      "tattoo_user",
      currentUser
    );

  }

  const USER_NAMES = {
    you: "You",
    mela: "Mela"
  };

  const OTHER_USER =
    currentUser === "you"
      ? "mela"
      : "you";


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const messages =
    document.getElementById(
      "messages"
    );

  const composer =
    document.getElementById(
      "composer"
    );

  const messageInput =
    document.getElementById(
      "messageInput"
    );

  const emojiPanel =
    document.getElementById(
      "emojiPanel"
    );

  const fileInput =
    document.getElementById(
      "fileInput"
    );

  const attachmentPreview =
    document.getElementById(
      "attachmentPreview"
    );

  const attachmentName =
    document.getElementById(
      "attachmentName"
    );

  const typingIndicator =
    document.getElementById(
      "typingIndicator"
    );

  const statusText =
    document.getElementById(
      "statusText"
    );

  const jumpBtn =
    document.getElementById(
      "jumpBtn"
    );


  /* =====================================================
     STATE
  ===================================================== */

  let selectedFile = null;

  let typingTimer = null;


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHTML(value) {

    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function formatTime(dateString) {

    return new Date(
      dateString
    ).toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }


  function scrollToBottom() {

    requestAnimationFrame(() => {

      messages.scrollTop =
        messages.scrollHeight;

    });

  }


  function isNearBottom() {

    return (
      messages.scrollHeight -
      messages.scrollTop -
      messages.clientHeight
    ) < 180;

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderMessage(message) {

    if (!message) return;

    if (
      document.querySelector(
        `[data-message-id="${message.id}"]`
      )
    ) {
      return;
    }

    const row =
      document.createElement(
        "div"
      );

    const mine =
      message.sender_id ===
      currentUser;

    row.className =
      mine
        ? "row me"
        : "row them";

    row.dataset.messageId =
      message.id;

    const wrap =
      document.createElement(
        "div"
      );

    wrap.className =
      "message-wrap";

    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "bubble";


    if (
      message.message_type ===
      "text"
    ) {

      bubble.innerHTML =
        escapeHTML(
          message.content
        ).replaceAll(
          "\n",
          "<br>"
        );

    }


    else if (
      message.message_type ===
      "image"
    ) {

      if (message.media_path) {

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "media";

        img.src =
          message.media_path;

        img.alt =
          "Photo";

        bubble.appendChild(
          img
        );

      }

    }


    else if (
      message.message_type ===
      "video"
    ) {

      if (message.media_path) {

        const video =
          document.createElement(
            "video"
          );

        video.className =
          "media";

        video.src =
          message.media_path;

        video.controls =
          true;

        video.playsInline =
          true;

        bubble.appendChild(
          video
        );

      }

    }


    const meta =
      document.createElement(
        "div"
      );

    meta.className =
      "message-meta";

    const time =
      document.createElement(
        "span"
      );

    time.textContent =
      formatTime(
        message.created_at
      );

    meta.appendChild(
      time
    );


    if (mine) {

      const checks =
        document.createElement(
          "span"
        );

      checks.className =
        "checks";

      checks.textContent =
        message.read_at
          ? "✓✓"
          : "✓";

      if (message.read_at) {

        checks.classList.add(
          "read"
        );

      }

      meta.appendChild(
        checks
      );

    }


    wrap.appendChild(
      bubble
    );

    wrap.appendChild(
      meta
    );

    row.appendChild(
      wrap
    );

    messages.appendChild(
      row
    );

  }


  /* =====================================================
     LOAD MESSAGES
  ===================================================== */

  async function loadMessages() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("chat_messages")
        .select("*")
        .eq(
          "room_id",
          ROOM_ID
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Load messages:",
        error
      );

      return;

    }


    messages.innerHTML =
      '<div class="date-divider">TODAY</div>';


    (data || []).forEach(
      renderMessage
    );


    scrollToBottom();

    markMessagesRead();

  }


  /* =====================================================
     SEND TEXT
  ===================================================== */

  async function sendText() {

    const text =
      messageInput.value.trim();

    if (!text) return;

    messageInput.value =
      "";

    stopTyping();


    const {
      error
    } =
      await supabaseClient
        .from("chat_messages")
        .insert({

          room_id:
            ROOM_ID,

          sender_id:
            currentUser,

          sender_name:
            USER_NAMES[currentUser],

          content:
            text,

          message_type:
            "text"

        });


    if (error) {

      console.error(
        "Send error:",
        error
      );

      alert(
        "Send error: " +
        error.message
      );

      messageInput.value =
        text;

    }

  }


  /* =====================================================
     SEND FILE
  ===================================================== */

  async function sendAttachment(file) {

    if (!file) return;


    const extension =
      file.name.includes(".")
        ? file.name
            .split(".")
            .pop()
            .toLowerCase()
        : "bin";


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      "." +
      extension;


    const path =
      currentUser +
      "/" +
      fileName;


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl:
              "3600",
            upsert:
              false,
            contentType:
              file.type
          }
        );


    if (error) {

      console.error(
        "Upload error:",
        error
      );

      alert(
        "Upload error: " +
        error.message
      );

      return;

    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from(BUCKET)
        .getPublicUrl(
          data.path
        );


    const type =
      file.type.startsWith(
        "video/"
      )
        ? "video"
        : "image";


    const {
      error: messageError
    } =
      await supabaseClient
        .from("chat_messages")
        .insert({

          room_id:
            ROOM_ID,

          sender_id:
            currentUser,

          sender_name:
            USER_NAMES[currentUser],

          content:
            "",

          message_type:
            type,

          media_path:
            publicData.publicUrl

        });


    if (messageError) {

      alert(
        "Message error: " +
        messageError.message
      );

    }

  }


  /* =====================================================
     REALTIME CHAT
  ===================================================== */

  const chatChannel =
    supabaseClient
      .channel(
        "tattoo-chat-room"
      )

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "chat_messages",
          filter:
            "room_id=eq.tattoo"
        },
        payload => {

          const message =
            payload.new;


          /*
            DOUBLE-SEND FIX

            Every message is rendered
            through this Realtime event.

            The duplicate check inside
            renderMessage() prevents
            accidental second rendering.
          */

          renderMessage(
            message
          );

          scrollToBottom();


          if (
            message.sender_id !==
            currentUser
          ) {

            markMessagesRead();

          }

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "chat_messages",
          filter:
            "room_id=eq.tattoo"
        },
        () => {

          loadMessages();

        }
      )

      .subscribe(
        status => {

          console.log(
            "Chat realtime:",
            status
          );

        }
      );


  /* =====================================================
     READ RECEIPTS
  ===================================================== */

  async function markMessagesRead() {

    await supabaseClient
      .from("chat_messages")
      .update({

        read_at:
          new Date().toISOString()

      })
      .eq(
        "room_id",
        ROOM_ID
      )
      .eq(
        "sender_id",
        OTHER_USER
      )
      .is(
        "read_at",
        null
      );

  }


  /* =====================================================
     PRESENCE
  ===================================================== */

  const presenceChannel =
    supabaseClient.channel(
      "tattoo-presence",
      {
        config: {
          presence: {
            key: currentUser
          }
        }
      }
    );


  presenceChannel
    .on(
      "presence",
      {
        event: "sync"
      },
      () => {

        updatePresence();

        updateTyping();

      }
    )

    .on(
      "presence",
      {
        event: "join"
      },
      () => {

        updatePresence();

        updateTyping();

      }
    )

    .on(
      "presence",
      {
        event: "leave"
      },
      () => {

        updatePresence();

        updateTyping();

      }
    )

    .subscribe(
      async status => {

        console.log(
          "Presence:",
          status
        );


        if (
          status ===
          "SUBSCRIBED"
        ) {

          await trackPresence();

          updatePresence();

        }

      }
    );


  async function trackPresence(
    typing = false
  ) {

    try {

      await presenceChannel.track({

        user_id:
          currentUser,

        display_name:
          USER_NAMES[currentUser],

        online:
          true,

        typing:
          typing,

        last_seen:
          new Date().toISOString()

      });

    } catch (error) {

      console.error(
        "Presence error:",
        error
      );

    }

  }


  function updatePresence() {

    const state =
      presenceChannel
        .presenceState();


    let online =
      false;


    Object.values(state)
      .flat()
      .forEach(item => {

        if (
          item.user_id ===
          OTHER_USER &&
          item.online === true
        ) {

          online =
            true;

        }

      });


    if (online) {

      statusText.textContent =
        "Online";

      statusText.classList.add(
        "online"
      );

    } else {

      statusText.textContent =
        "Offline";

      statusText.classList.remove(
        "online"
      );

    }

  }


  /* =====================================================
     TYPING
  ===================================================== */

  async function setTyping(
    value
  ) {

    await trackPresence(
      value
    );

  }


  function updateTyping() {

    const state =
      presenceChannel
        .presenceState();


    let typing =
      false;


    Object.values(state)
      .flat()
      .forEach(item => {

        if (
          item.user_id ===
          OTHER_USER &&
          item.typing === true
        ) {

          typing =
            true;

        }

      });


    typingIndicator.classList.toggle(
      "show",
      typing
    );

  }


  function stopTyping() {

    clearTimeout(
      typingTimer
    );

    setTyping(false);

  }


  messageInput.addEventListener(
    "input",
    () => {

      setTyping(true);

      clearTimeout(
        typingTimer
      );

      typingTimer =
        setTimeout(
          stopTyping,
          1200
        );

    }
  );


  /* =====================================================
     COMPOSER
  ===================================================== */

  composer.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if (selectedFile) {

        const file =
          selectedFile;

        clearAttachment();

        await sendAttachment(
          file
        );

        return;

      }


      await sendText();

    }
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        composer.requestSubmit();

      }

    }
  );


  /* =====================================================
     EMOJI
  ===================================================== */

  document
    .getElementById("emojiBtn")
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        emojiPanel.classList.toggle(
          "show"
        );

      }
    );


  document
    .querySelectorAll(".emoji")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            messageInput.focus();

            messageInput.value +=
              button.textContent;

          }
        );

      }
    );


  /* =====================================================
     ATTACHMENTS
  ===================================================== */

  document
    .getElementById("attachmentBtn")
    .addEventListener(
      "click",
      () => {

        fileInput.click();

      }
    );


  fileInput.addEventListener(
    "change",
    () => {

      const file =
        fileInput.files[0];

      if (!file) return;

      selectedFile =
        file;

      attachmentName.textContent =
        file.name;

      attachmentPreview.classList.add(
        "show"
      );

    }
  );


  function clearAttachment() {

    selectedFile =
      null;

    fileInput.value =
      "";

    attachmentName.textContent =
      "";

    attachmentPreview.classList.remove(
      "show"
    );

  }


  document
    .getElementById(
      "removeAttachment"
    )
    .addEventListener(
      "click",
      clearAttachment
    );


  /* =====================================================
     BACK
  ===================================================== */

  document
    .getElementById("backBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "index.html";

      }
    );


  /* =====================================================
     PROFILE
  ===================================================== */

  const profileOverlay =
    document.getElementById(
      "profileOverlay"
    );


  document
    .getElementById("profileBtn")
    .addEventListener(
      "click",
      () => {

        profileOverlay.classList.add(
          "show"
        );

      }
    );


  document
    .getElementById("closeProfile")
    .addEventListener(
      "click",
      () => {

        profileOverlay.classList.remove(
          "show"
        );

      }
    );


  /* =====================================================
     SEARCH
  ===================================================== */

  const searchOverlay =
    document.getElementById(
      "searchOverlay"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  document
    .getElementById("searchBtn")
    .addEventListener(
      "click",
      () => {

        searchOverlay.classList.add(
          "show"
        );

        setTimeout(
          () => {
            searchInput.focus();
          },
          100
        );

      }
    );


  document
    .getElementById("closeSearch")
    .addEventListener(
      "click",
      () => {

        searchOverlay.classList.remove(
          "show"
        );

      }
    );


  document
    .getElementById("runSearch")
    .addEventListener(
      "click",
      () => {

        const term =
          searchInput.value
            .trim()
            .toLowerCase();


        searchOverlay.classList.remove(
          "show"
        );


        if (!term) return;


        const rows =
          document.querySelectorAll(
            ".row"
          );


        let found =
          false;


        rows.forEach(
          row => {

            const match =
              row.textContent
                .toLowerCase()
                .includes(term);


            row.style.outline =
              match
                ? "2px solid rgba(233,168,196,.7)"
                : "";


            if (match && !found) {

              found =
                true;

              row.scrollIntoView({
                behavior:
                  "smooth",
                block:
                  "center"
              });

            }

          }
        );


        if (!found) {

          alert(
            "No matching message found."
          );

        }

      }
    );


  /* =====================================================
     MORE MENU
  ===================================================== */

  const moreOverlay =
    document.getElementById(
      "moreOverlay"
    );


  document
    .getElementById("moreBtn")
    .addEventListener(
      "click",
      () => {

        moreOverlay.classList.add(
          "show"
        );

      }
    );


  document
    .getElementById("closeMore")
    .addEventListener(
      "click",
      () => {

        moreOverlay.classList.remove(
          "show"
        );

      }
    );


  /* =====================================================
     SAVE CHAT
  ===================================================== */

  document
    .getElementById("saveConversation")
    .addEventListener(
      "click",
      async () => {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("chat_messages")
            .select("*")
            .eq(
              "room_id",
              ROOM_ID
            )
            .order(
              "created_at",
              {
                ascending:
                  true
              }
            );


        if (error) {

          alert(
            "Could not save conversation."
          );

          return;

        }


        const text =
          (data || [])
            .map(
              message =>
                `[${formatTime(
                  message.created_at
                )}] ` +
                `${message.sender_name}: ` +
                (
                  message.content ||
                  `[${message.message_type}]`
                )
            )
            .join("\n");


        const blob =
          new Blob(
            [text],
            {
              type:
                "text/plain;charset=utf-8"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            "a"
          );

        link.href =
          url;

        link.download =
          "tattoo-chat.txt";

        link.click();


        URL.revokeObjectURL(
          url
        );


        moreOverlay.classList.remove(
          "show"
        );

      }
    );


  /* =====================================================
     CLEAR MY MESSAGES
  ===================================================== */

  document
    .getElementById(
      "clearMyMessages"
    )
    .addEventListener(
      "click",
      async () => {

        const confirmed =
          confirm(
            "Delete all your messages from this chat?"
          );


        if (!confirmed) return;


        const {
          error
        } =
          await supabaseClient
            .from("chat_messages")
            .delete()
            .eq(
              "room_id",
              ROOM_ID
            )
            .eq(
              "sender_id",
              currentUser
            );


        if (error) {

          alert(
            "Could not delete messages: " +
            error.message
          );

          return;

        }


        moreOverlay.classList.remove(
          "show"
        );

        loadMessages();

      }
    );


  /* =====================================================
     CHANGE IDENTITY
  ===================================================== */

  const identityOverlay =
    document.getElementById(
      "identityOverlay"
    );


  document
    .getElementById(
      "changeIdentity"
    )
    .addEventListener(
      "click",
      () => {

        moreOverlay.classList.remove(
          "show"
        );

        identityOverlay.classList.add(
          "show"
        );

      }
    );


  document
    .querySelectorAll(
      ".identity-option"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            localStorage.setItem(
              "tattoo_user",
              button.dataset.user
            );

            location.reload();

          }
        );

      }
    );


  /* =====================================================
     JUMP
  ===================================================== */

  messages.addEventListener(
    "scroll",
    () => {

      jumpBtn.classList.toggle(
        "show",
        !isNearBottom()
      );

    }
  );


  jumpBtn.addEventListener(
    "click",
    scrollToBottom
  );


  /* =====================================================
     CLOSE POPUPS
  ===================================================== */

  document
    .querySelectorAll(
      ".overlay"
    )
    .forEach(
      overlay => {

        overlay.addEventListener(
          "click",
          event => {

            if (
              event.target ===
              overlay
            ) {

              overlay.classList.remove(
                "show"
              );

            }

          }
        );

      }
    );


  /* =====================================================
     ESCAPE
  ===================================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        emojiPanel.classList.remove(
          "show"
        );

        document
          .querySelectorAll(
            ".overlay"
          )
          .forEach(
            overlay => {

              overlay.classList.remove(
                "show"
              );

            }
          );

      }

    }
  );


  /* =====================================================
     START
  ===================================================== */

  loadMessages();

  messageInput.focus();

</script>

</body>
</html>
