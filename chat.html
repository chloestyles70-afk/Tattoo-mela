<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat — Tattoo</title>

  <style>
    :root {
      --bg: #0d0b10;
      --panel: #17131b;
      --panel-soft: #211a23;
      --text: #f8f2f5;
      --muted: #b9adb5;
      --accent: #e9a8c4;
      --accent-dark: #d98faf;
      --line: rgba(255,255,255,.10);
      --shadow: rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(233,168,196,.12),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* APP */

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      margin: auto;
      background: rgba(13,11,16,.94);
      position: relative;
      overflow: hidden;
    }

    /* HEADER */

    .topbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 700px;
      height: 72px;
      z-index: 20;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 10px 15px;

      background: rgba(23,19,27,.94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,.06);
      color: var(--text);

      display: grid;
      place-items: center;

      font-size: 18px;
      transition: .2s;
    }

    .icon-btn:hover {
      background: rgba(233,168,196,.16);
      transform: scale(1.05);
    }

    .profile {
      flex: 1;

      display: flex;
      align-items: center;
      gap: 10px;

      cursor: pointer;
    }

    .avatar {
      width: 43px;
      height: 43px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #e9a8c4,
          #b96d8e
        );

      color: #24151d;
      font-weight: bold;
      font-size: 18px;

      box-shadow:
        0 0 0 3px rgba(233,168,196,.08),
        0 5px 18px rgba(0,0,0,.25);
    }

    .profile-info strong {
      display: block;
      font-size: 15px;
    }

    .status {
      color: #d7bfc9;
      font-size: 12px;
      margin-top: 2px;
    }

    .online-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ed6b0;
      margin-right: 4px;
    }

    /* MESSAGES */

    .message-list {
      min-height: 100vh;
      padding: 90px 16px 120px;
      overflow-y: auto;
    }

    .date-divider {
      text-align: center;
      margin: 10px 0 22px;

      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .row {
      display: flex;
      margin: 8px 0;
      animation: bubbleIn .25s ease;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.them {
      justify-content: flex-start;
    }

    /* CUTE BUBBLES */

    .bubble {
      position: relative;

      max-width: 78%;

      padding: 11px 15px;

      border-radius: 20px;

      font-size: 15px;
      line-height: 1.5;

      word-wrap: break-word;

      box-shadow:
        0 5px 18px rgba(0,0,0,.18);

      transition: transform .2s;
    }

    .bubble:hover {
      transform: translateY(-1px);
    }

    /* MELA */

    .row.them .bubble {
      background: #211a23;
      color: var(--text);

      border: 1px solid rgba(233,168,196,.12);

      border-bottom-left-radius: 6px;
    }

    .row.them .bubble::after {
      content: "";

      position: absolute;
      left: -6px;
      bottom: 2px;

      width: 12px;
      height: 12px;

      background: #211a23;

      clip-path: polygon(
        100% 0,
        0 100%,
        100% 100%
      );
    }

    /* YOU */

    .row.me .bubble {
      background:
        linear-gradient(
          135deg,
          #e9a8c4,
          #d98faf
        );

      color: #24151d;

      border-bottom-right-radius: 6px;
    }

    .row.me .bubble::after {
      content: "";

      position: absolute;
      right: -6px;
      bottom: 2px;

      width: 12px;
      height: 12px;

      background: #d98faf;

      clip-path: polygon(
        0 0,
        100% 100%,
        0 100%
      );
    }

    /* MESSAGE META */

    .message-meta {
      display: flex;
      align-items: center;
      gap: 5px;

      margin-top: 5px;

      font-family: Arial, sans-serif;
      font-size: 9px;

      opacity: .65;
    }

    .row.me .message-meta {
      justify-content: flex-end;
    }

    .checks {
      letter-spacing: -3px;
    }

    /* TYPING */

    .typing-row {
      display: none;
      margin: 8px 0;
    }

    .typing-row.show {
      display: flex;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 4px;

      padding: 12px 15px;

      background: #211a23;

      border-radius: 20px;
      border-bottom-left-radius: 6px;
    }

    .typing-bubble span {
      width: 6px;
      height: 6px;

      background: var(--accent);

      border-radius: 50%;

      animation: typingDot 1.2s infinite ease-in-out;
    }

    .typing-bubble span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-bubble span:nth-child(3) {
      animation-delay: .3s;
    }

    /* MEDIA */

    .media-bubble {
      padding: 4px;
      overflow: hidden;
      border-radius: 20px;
    }

    .media-bubble img,
    .media-bubble video {
      display: block;

      max-width: 240px;
      max-height: 300px;

      border-radius: 16px;

      object-fit: cover;
    }

    /* COMPOSER */

    .composer {
      position: fixed;

      bottom: 0;
      left: 50%;
      transform: translateX(-50%);

      width: 100%;
      max-width: 700px;

      z-index: 20;

      padding: 10px 12px 14px;

      background: rgba(23,19,27,.96);
      backdrop-filter: blur(18px);

      border-top: 1px solid var(--line);
    }

    .composer-inner {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-wrap {
      flex: 1;

      display: flex;
      align-items: center;

      min-height: 46px;

      padding: 4px 6px 4px 15px;

      background: #211a23;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 24px;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #8f828b;
    }

    .send-btn {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: var(--accent);

      color: #24151d;

      display: grid;
      place-items: center;

      font-size: 16px;

      transition: .2s;
    }

    .send-btn:hover {
      transform: scale(1.08);
      background: #f1bad1;
    }

    .small-btn {
      width: 34px;
      height: 34px;

      border: none;
      background: transparent;

      color: var(--muted);

      border-radius: 50%;

      font-size: 18px;
    }

    .small-btn:hover {
      background: rgba(233,168,196,.10);
      color: var(--accent);
    }

    /* EMOJI PANEL */

    .emoji-panel {
      display: none;

      position: absolute;

      bottom: 76px;
      right: 12px;

      width: 280px;

      padding: 14px;

      background: #211a23;

      border: 1px solid var(--line);

      border-radius: 18px;

      box-shadow: 0 15px 40px var(--shadow);
    }

    .emoji-panel.show {
      display: block;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .emoji {
      border: none;
      background: transparent;

      font-size: 22px;

      padding: 5px;
      border-radius: 8px;
    }

    .emoji:hover {
      background: rgba(233,168,196,.12);
    }

    /* OVERLAY */

    .overlay {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 50;

      background: rgba(0,0,0,.65);

      align-items: flex-end;
      justify-content: center;
    }

    .overlay.show {
      display: flex;
    }

    .popup {
      width: 100%;
      max-width: 700px;

      background: #17131b;

      border-radius: 24px 24px 0 0;

      padding: 24px;

      border-top: 1px solid var(--line);

      box-shadow: 0 -10px 40px rgba(0,0,0,.4);

      animation: popupIn .25s ease;
    }

    .popup h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .popup p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .popup-input {
      width: 100%;

      padding: 13px 15px;

      border-radius: 14px;

      border: 1px solid var(--line);

      outline: none;

      background: #211a23;

      color: var(--text);

      margin-bottom: 12px;
    }

    .popup-btn {
      width: 100%;

      border: none;

      padding: 13px;

      border-radius: 14px;

      background: var(--accent);

      color: #24151d;

      margin-top: 8px;
    }

    .popup-btn.secondary {
      background: rgba(255,255,255,.07);
      color: var(--text);
    }

    /* ATTACHMENT */

    #fileInput {
      display: none;
    }

    .attachment-preview {
      display: none;

      margin-bottom: 8px;

      padding: 8px;

      background: #211a23;

      border-radius: 14px;
    }

    .attachment-preview.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .attachment-preview img,
    .attachment-preview video {
      width: 55px;
      height: 55px;

      object-fit: cover;

      border-radius: 10px;
    }

    .remove-file {
      margin-left: auto;

      border: none;

      background: transparent;

      color: #d99ab5;

      font-size: 18px;
    }

    /* ANIMATIONS */

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes typingDot {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .45;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .bubble {
        max-width: 82%;
        font-size: 14px;
        padding: 10px 14px;
      }

      .media-bubble img,
      .media-bubble video {
        max-width: 220px;
      }

      .emoji-panel {
        width: calc(100% - 24px);
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header class="topbar">

      <button
        class="icon-btn"
        id="backBtn"
        aria-label="Back"
      >
        ←
      </button>

      <div
        class="profile"
        id="profileBtn"
      >

        <div class="avatar">
          M
        </div>

        <div class="profile-info">

          <strong>Mela</strong>

          <div class="status">
            <span class="online-dot"></span>
            Online
          </div>

        </div>

      </div>

      <button
        class="icon-btn"
        id="searchBtn"
        aria-label="Search"
      >
        🔍
      </button>

      <button
        class="icon-btn"
        id="moreBtn"
        aria-label="More"
      >
        ⋯
      </button>

    </header>


    <!-- MESSAGES -->

    <main
      class="message-list"
      id="messageList"
    >

      <div class="date-divider">
        TODAY
      </div>


      <!-- SAMPLE MELA MESSAGE -->

      <div class="row them">

        <div class="bubble">

          Hey ❤️

          <div class="message-meta">
            10:42 AM
          </div>

        </div>

      </div>


      <!-- SAMPLE USER MESSAGE -->

      <div class="row me">

        <div class="bubble">

          Hey Mela. I made this little place for us.

          <div class="message-meta">
            10:43 AM
            <span class="checks">✓✓</span>
          </div>

        </div>

      </div>


      <!-- SAMPLE MELA MESSAGE -->

      <div class="row them">

        <div class="bubble">

          I actually love it 🥹💗

          <div class="message-meta">
            10:44 AM
          </div>

        </div>

      </div>


      <!-- TYPING -->

      <div
        class="typing-row"
        id="typingRow"
      >

        <div class="typing-bubble">

          <span></span>
          <span></span>
          <span></span>

        </div>

      </div>

    </main>


    <!-- COMPOSER -->

    <div class="composer">

      <div
        class="attachment-preview"
        id="attachmentPreview"
      >

        <div id="attachmentContent"></div>

        <button
          class="remove-file"
          id="removeFile"
        >
          ×
        </button>

      </div>


      <form
        class="composer-inner"
        id="messageForm"
      >

        <button
          type="button"
          class="small-btn"
          id="attachmentBtn"
          title="Attach"
        >
          ＋
        </button>

        <input
          type="file"
          id="fileInput"
          accept="image/*,video/*"
        >


        <div class="input-wrap">

          <input
            type="text"
            id="messageInput"
            placeholder="Message Mela..."
            autocomplete="off"
          >

          <button
            type="button"
            class="small-btn"
            id="emojiBtn"
          >
            ☺
          </button>

          <button
            type="submit"
            class="send-btn"
          >
            ↑
          </button>

        </div>

      </form>


      <!-- EMOJI PANEL -->

      <div
        class="emoji-panel"
        id="emojiPanel"
      >

        <div class="emoji-grid">

          <button class="emoji">❤️</button>
          <button class="emoji">💕</button>
          <button class="emoji">💗</button>
          <button class="emoji">💖</button>
          <button class="emoji">💘</button>
          <button class="emoji">🥹</button>
          <button class="emoji">😍</button>

          <button class="emoji">😘</button>
          <button class="emoji">😊</button>
          <button class="emoji">😂</button>
          <button class="emoji">😭</button>
          <button class="emoji">🥰</button>
          <button class="emoji">😌</button>
          <button class="emoji">🫶</button>

          <button class="emoji">💋</button>
          <button class="emoji">🌹</button>
          <button class="emoji">✨</button>
          <button class="emoji">🥺</button>
          <button class="emoji">😚</button>
          <button class="emoji">🤍</button>
          <button class="emoji">🩷</button>

        </div>

      </div>

    </div>

  </div>


  <!-- PROFILE POPUP -->

  <div
    class="overlay"
    id="profileOverlay"
  >

    <div class="popup">

      <h2>Mela ❤️</h2>

      <p>
        A little place for us to talk, laugh,
        share things and keep our memories.
      </p>

      <button
        class="popup-btn secondary"
        data-close="profileOverlay"
      >
        Close
      </button>

    </div>

  </div>


  <!-- SEARCH POPUP -->

  <div
    class="overlay"
    id="searchOverlay"
  >

    <div class="popup">

      <h2>Search our chat</h2>

      <input
        class="popup-input"
        id="searchInput"
        placeholder="Search messages..."
      >

      <button
        class="popup-btn"
        id="searchConfirm"
      >
        Search
      </button>

      <button
        class="popup-btn secondary"
        data-close="searchOverlay"
      >
        Close
      </button>

    </div>

  </div>


  <!-- MORE POPUP -->

  <div
    class="overlay"
    id="moreOverlay"
  >

    <div class="popup">

      <h2>Chat options</h2>

      <button
        class="popup-btn"
        id="jumpLatest"
      >
        ↓ Jump to latest
      </button>

      <button
        class="popup-btn"
        id="saveConversation"
      >
        Save conversation
      </button>

      <button
        class="popup-btn secondary"
        id="clearMessages"
      >
        Clear my messages
      </button>

      <button
        class="popup-btn secondary"
        data-close="moreOverlay"
      >
        Close
      </button>

    </div>

  </div>


  <script>

    /* ELEMENTS */

    const messageList =
      document.getElementById("messageList");

    const messageForm =
      document.getElementById("messageForm");

    const messageInput =
      document.getElementById("messageInput");

    const typingRow =
      document.getElementById("typingRow");

    const emojiBtn =
      document.getElementById("emojiBtn");

    const emojiPanel =
      document.getElementById("emojiPanel");

    const attachmentBtn =
      document.getElementById("attachmentBtn");

    const fileInput =
      document.getElementById("fileInput");

    const attachmentPreview =
      document.getElementById("attachmentPreview");

    const attachmentContent =
      document.getElementById("attachmentContent");

    const removeFile =
      document.getElementById("removeFile");


    /* NAVIGATION */

    document
      .getElementById("backBtn")
      .addEventListener("click", () => {
        window.location.href = "index.html";
      });


    /* PROFILE */

    document
      .getElementById("profileBtn")
      .addEventListener("click", () => {
        openOverlay("profileOverlay");
      });


    /* SEARCH */

    document
      .getElementById("searchBtn")
      .addEventListener("click", () => {

        openOverlay("searchOverlay");

        setTimeout(() => {
          document
            .getElementById("searchInput")
            .focus();
        }, 100);

      });


    document
      .getElementById("searchConfirm")
      .addEventListener("click", () => {

        const query =
          document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

        if (!query) return;

        const rows =
          document.querySelectorAll(".row");

        let found = false;

        rows.forEach(row => {

          const text =
            row.innerText.toLowerCase();

          if (text.includes(query)) {

            row.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });

            row.style.transform = "scale(1.04)";

            setTimeout(() => {
              row.style.transform = "";
            }, 700);

            found = true;

          }

        });

        if (!found) {
          alert("No message found.");
        }

      });


    /* MORE */

    document
      .getElementById("moreBtn")
      .addEventListener("click", () => {
        openOverlay("moreOverlay");
      });


    /* JUMP LATEST */

    document
      .getElementById("jumpLatest")
      .addEventListener("click", () => {

        messageList.scrollTo({
          top: messageList.scrollHeight,
          behavior: "smooth"
        });

        closeOverlays();

      });


    /* SAVE CONVERSATION */

    document
      .getElementById("saveConversation")
      .addEventListener("click", () => {

        const rows =
          document.querySelectorAll(".row");

        let text = "Tattoo — Our Chat\n\n";

        rows.forEach(row => {

          const who =
            row.classList.contains("me")
              ? "You"
              : "Mela";

          text +=
            who + ": " +
            row.innerText.trim() +
            "\n\n";

        });

        const blob =
          new Blob([text], {
            type: "text/plain"
          });

        const url =
          URL.createObjectURL(blob);

        const a =
          document.createElement("a");

        a.href = url;
        a.download = "tattoo-chat.txt";

        a.click();

        URL.revokeObjectURL(url);

      });


    /* CLEAR MY MESSAGES */

    document
      .getElementById("clearMessages")
      .addEventListener("click", () => {

        const okay =
          confirm(
            "Clear all your messages from this device?"
          );

        if (!okay) return;

        document
          .querySelectorAll(".row.me")
          .forEach(row => row.remove());

        localStorage.removeItem("tattooMessages");

        closeOverlays();

      });


    /* EMOJI */

    emojiBtn.addEventListener("click", event => {

      event.stopPropagation();

      emojiPanel.classList.toggle("show");

    });


    document
      .querySelectorAll(".emoji")
      .forEach(button => {

        button.addEventListener("click", () => {

          messageInput.value +=
            button.textContent;

          messageInput.focus();

        });

      });


    /* CLOSE EMOJI WHEN CLICKING OUTSIDE */

    document.addEventListener("click", event => {

      if (
        !emojiPanel.contains(event.target) &&
        event.target !== emojiBtn
      ) {
        emojiPanel.classList.remove("show");
      }

    });


    /* TYPING */

    let typingTimer;

    messageInput.addEventListener("input", () => {

      typingRow.classList.add("show");

      clearTimeout(typingTimer);

      typingTimer = setTimeout(() => {

        typingRow.classList.remove("show");

      }, 900);

    });


    /* ATTACHMENT */

    attachmentBtn.addEventListener("click", () => {
      fileInput.click();
    });


    fileInput.addEventListener("change", () => {

      const file = fileInput.files[0];

      if (!file) return;

      attachmentPreview.classList.add("show");

      attachmentContent.innerHTML = "";

      const url =
        URL.createObjectURL(file);

      if (file.type.startsWith("image/")) {

        const img =
          document.createElement("img");

        img.src = url;

        attachmentContent.appendChild(img);

      } else if (file.type.startsWith("video/")) {

        const video =
          document.createElement("video");

        video.src = url;
        video.controls = true;

        attachmentContent.appendChild(video);

      }

    });


    removeFile.addEventListener("click", () => {

      fileInput.value = "";

      attachmentContent.innerHTML = "";

      attachmentPreview.classList.remove("show");

    });


    /* SEND MESSAGE */

    messageForm.addEventListener("submit", event => {

      event.preventDefault();

      const text =
        messageInput.value.trim();

      const file =
        fileInput.files[0];

      if (!text && !file) return;


      if (text) {

        addMessage(
          text,
          "me"
        );

      }


      if (file) {

        addMediaMessage(file);

      }


      messageInput.value = "";

      fileInput.value = "";

      attachmentContent.innerHTML = "";

      attachmentPreview.classList.remove("show");

      typingRow.classList.remove("show");

      emojiPanel.classList.remove("show");

      scrollBottom();

    });


    /* ADD TEXT MESSAGE */

    function addMessage(text, type) {

      const row =
        document.createElement("div");

      row.className =
        "row " + type;

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      const content =
        document.createElement("div");

      content.textContent =
        text;

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      const time =
        new Date().toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );

      meta.innerHTML =
        time +
        (type === "me"
          ? ' <span class="checks">✓✓</span>'
          : "");

      bubble.appendChild(content);
      bubble.appendChild(meta);

      row.appendChild(bubble);

      messageList.insertBefore(
        row,
        typingRow
      );

      saveMessage(
        text,
        type
      );

    }


    /* ADD MEDIA MESSAGE */

    function addMediaMessage(file) {

      const row =
        document.createElement("div");

      row.className =
        "row me";

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble media-bubble";

      const url =
        URL.createObjectURL(file);

      if (file.type.startsWith("image/")) {

        const img =
          document.createElement("img");

        img.src = url;

        bubble.appendChild(img);

      } else {

        const video =
          document.createElement("video");

        video.src = url;
        video.controls = true;

        bubble.appendChild(video);

      }

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      meta.innerHTML =
        new Date().toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit"
          }
        ) +
        ' <span class="checks">✓✓</span>';

      bubble.appendChild(meta);

      row.appendChild(bubble);

      messageList.insertBefore(
        row,
        typingRow
      );

    }


    /* LOCAL STORAGE */

    function saveMessage(text, type) {

      const saved =
        JSON.parse(
          localStorage.getItem(
            "tattooMessages"
          ) || "[]"
        );

      saved.push({
        text,
        type,
        time: Date.now()
      });

      localStorage.setItem(
        "tattooMessages",
        JSON.stringify(saved)
      );

    }


    /* SCROLL */

    function scrollBottom() {

      setTimeout(() => {

        messageList.scrollTo({
          top: messageList.scrollHeight,
          behavior: "smooth"
        });

      }, 50);

    }


    /* OVERLAYS */

    function openOverlay(id) {

      document
        .getElementById(id)
        .classList.add("show");

    }


    function closeOverlays() {

      document
        .querySelectorAll(".overlay")
        .forEach(overlay => {
          overlay.classList.remove("show");
        });

    }


    document
      .querySelectorAll("[data-close]")
      .forEach(button => {

        button.addEventListener("click", () => {

          const id =
            button.dataset.close;

          document
            .getElementById(id)
            .classList.remove("show");

        });

      });


    /* CLICK OUTSIDE POPUP */

    document
      .querySelectorAll(".overlay")
      .forEach(overlay => {

        overlay.addEventListener("click", event => {

          if (event.target === overlay) {
            overlay.classList.remove("show");
          }

        });

      });


    /* ESCAPE */

    document.addEventListener("keydown", event => {

      if (event.key === "Escape") {

        closeOverlays();

        emojiPanel.classList.remove("show");

      }

    });


    /* ENTER TO SEND */

    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          messageForm.requestSubmit();

        }

      }
    );


    /* INITIAL SCROLL */

    window.addEventListener(
      "load",
      scrollBottom
    );

  </script>
