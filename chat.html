<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0d0b10" />

  <title>Our Little World — Chat</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    .world-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% 0%, rgba(233,168,196,.10), transparent 35%),
        var(--bg);
    }

    .world-header {
      padding: 22px 20px 14px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .world-header h1 {
      margin: 4px 0 6px;
      font-size: 28px;
      font-weight: normal;
    }

    .world-header p {
      margin: 0;
      color: var(--muted);
      font: 13px/1.5 Arial, sans-serif;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px 110px;
    }

    .message {
      max-width: 78%;
      margin-bottom: 14px;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.them {
      margin-right: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
    }

    .message.me {
      margin-left: auto;
      background: rgba(233,168,196,.18);
      border: 1px solid rgba(233,168,196,.25);
      border-bottom-right-radius: 5px;
    }

    .chat-input {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 8px;
      padding: 12px;
      background: rgba(13,11,16,.94);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 12px 15px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font: 15px Georgia, serif;
    }

    .chat-input button {
      border: 0;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      background: var(--accent);
      color: #241720;
      cursor: pointer;
    }

    .world-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px;
    }

    .world-nav a {
      color: var(--text);
      text-decoration: none;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      font: 12px Arial, sans-serif;
    }
  </style>
</head>

<body>

  <main class="world-page">

    <header class="world-header">
      <div class="eyebrow">OUR LITTLE WORLD</div>
      <h1>Chat</h1>
      <p>A little place for us to talk.</p>

      <nav class="world-nav">
        <a href="index.html">Tattoo</a>
        <a href="chat.html">Chat</a>
        <a href="memories.html">Memories</a>
      </nav>
    </header>

    <section class="chat-area" id="chatArea">

      <div class="message them">
        Hey Mela ❤️
      </div>

      <div class="message me">
        This is our little space.
      </div>

    </section>

    <form class="chat-input" id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Write something..."
        autocomplete="off"
      />

      <button type="submit" aria-label="Send message">
        ↑
      </button>
    </form>

  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const chatArea = document.getElementById("chatArea");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();

      if (!text) return;

      const message = document.createElement("div");

      message.className = "message me";
      message.textContent = text;

      chatArea.appendChild(message);

      input.value = "";

      chatArea.scrollTop = chatArea.scrollHeight;
    });
  </script>

</body>
</html>
