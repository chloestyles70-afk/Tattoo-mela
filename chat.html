<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0d0b10">

  <title>Chat — Our Little World</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0d0b10;
      --panel: #17131b;
      --panel2: #1d1821;
      --text: #f8f2f5;
      --muted: #9f929b;
      --accent: #e9a8c4;
      --line: rgba(255,255,255,.09);
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }


    /* APP */

    .app {
      height: 100svh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: var(--bg);
    }


    /* HEADER */

    .header {
      height: 72px;
      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 10px 15px;

      border-bottom: 1px solid var(--line);

      background: rgba(13,11,16,.94);

      backdrop-filter: blur(18px);
    }


    .back {
      width: 40px;
      height: 40px;

      border: 0;
      background: transparent;

      color: var(--text);

      font-size: 25px;

      cursor: pointer;
    }


    .profile {
      display: flex;
      align-items: center;
      gap: 11px;

      flex: 1;
      min-width: 0;
    }


    .avatar {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #e9a8c4,
          #8f6077
        );

      color: #241720;

      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: bold;

      box-shadow:
        0 0 0 3px rgba(233,168,196,.08);
    }


    .profile-info {
      min-width: 0;
    }


    .profile-name {
      font-family: Georgia, serif;
      font-size: 17px;
      white-space: nowrap;
    }


    .status {
      margin-top: 3px;

      display: flex;
      align-items: center;
      gap: 5px;

      color: #8fc7a1;

      font-size: 11px;
    }


    .online-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #78c991;

      box-shadow:
        0 0 8px rgba(120,201,145,.7);
    }


    .header-actions {
      display: flex;
      gap: 3px;
    }


    .header-btn {
      width: 38px;
      height: 38px;

      border: 0;

      background: transparent;

      color: var(--muted);

      border-radius: 50%;

      font-size: 18px;

      cursor: pointer;
    }


    .header-btn:active {
      background: var(--panel);
    }


    /* MESSAGES */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 18px 14px 105px;

      scroll-behavior: smooth;
    }


    .date {
      text-align: center;

      margin: 4px 0 20px;

      color: #716871;

      font-size: 10px;

      letter-spacing: 1px;
    }


    .row {
      display: flex;

      margin-bottom: 6px;
    }


    .row.me {
      justify-content: flex-end;
    }


    .row.them {
      justify-content: flex-start;
    }


    .bubble {
      position: relative;

      max-width: min(72%, 500px);

      padding: 9px 13px 7px;

      border-radius: 18px;

      font-family: Georgia, serif;

      font-size: 15px;

      line-height: 1.45;

      word-wrap: break-word;
    }


    .them .bubble {
      background: var(--panel2);

      border: 1px solid var(--line);

      border-bottom-left-radius: 5px;
    }


    .me .bubble {
      background: #d995b3;

      color: #241720;

      border-bottom-right-radius: 5px;
    }


    .time {
      display: inline-block;

      margin-left: 8px;

      font-family: Arial, sans-serif;

      font-size: 9px;

      opacity: .55;

      vertical-align: bottom;
    }


    .read {
      margin-left: 3px;

      font-size: 10px;

      opacity: .7;
    }


    /* MESSAGE GROUPS */

    .group-gap {
      margin-top: 13px;
    }


    /* TYPING */

    .typing-row {
      display: none;

      margin: 5px 0 13px;
    }


    .typing-row.show {
      display: flex;
    }


    .typing {
      display: flex;

      align-items: center;

      gap: 4px;

      padding: 11px 14px;

      border-radius: 18px;

      border-bottom-left-radius: 5px;

      background: var(--panel2);

      border: 1px solid var(--line);
    }


    .typing span {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--muted);

      animation: bounce 1.2s infinite;
    }


    .typing span:nth-child(2) {
      animation-delay: .15s;
    }


    .typing span:nth-child(3) {
      animation-delay: .3s;
    }


    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-4px);
      }

    }


    /* COMPOSER */

    .composer-area {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 20;

      padding:
        9px
        12px
        calc(9px + env(safe-area-inset-bottom));

      background: rgba(13,11,16,.96);

      border-top: 1px solid var(--line);

      backdrop-filter: blur(18px);
    }


    .composer {
      max-width: 900px;

      margin: auto;

      display: flex;

      align-items: flex-end;

      gap: 7px;
    }


    .attach {
      width: 40px;
      height: 44px;

      flex-shrink: 0;

      border: 0;

      background: transparent;

      color: var(--muted);

      font-size: 21px;

      cursor: pointer;
    }


    .input-box {
      flex: 1;

      min-width: 0;

      display: flex;

      align-items: center;

      min-height: 44px;

      border-radius: 23px;

      background: var(--panel);

      border: 1px solid var(--line);

      padding: 0 5px 0 15px;
    }


    .input-box:focus-within {
      border-color: rgba(233,168,196,.45);
    }


    #messageInput {
      flex: 1;

      min-width: 0;

      height: 42px;

      border: 0;

      outline: 0;

      background: transparent;

      color: var(--text);

      font-family: Georgia, serif;

      font-size: 15px;
    }


    #messageInput::placeholder {
      color: #776d75;
    }


    .emoji {
      width: 36px;
      height: 36px;

      border: 0;

      background: transparent;

      color: var(--muted);

      font-size: 18px;

      cursor: pointer;
    }


    .send {
      width: 43px;
      height: 43px;

      flex-shrink: 0;

      border: 0;

      border-radius: 50%;

      background: var(--accent);

      color: #241720;

      font-size: 18px;

      cursor: pointer;

      transition: transform .15s;
    }


    .send:active {
      transform: scale(.9);
    }


    /* EMOJI POPUP */

    .emoji-panel {
      position: fixed;

      right: 15px;
      bottom: 72px;

      display: none;

      padding: 10px;

      border-radius: 17px;

      background: #1d1821;

      border: 1px solid var(--line);

      box-shadow: 0 15px 35px rgba(0,0,0,.4);

      z-index: 30;
    }


    .emoji-panel.show {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 7px;
    }


    .emoji-panel button {
      width: 35px;
      height: 35px;

      border: 0;

      background: transparent;

      border-radius: 9px;

      font-size: 20px;

      cursor: pointer;
    }


    .emoji-panel button:active {
      background: rgba(255,255,255,.07);
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .header {
        height: 68px;
      }

      .header-actions {
        gap: 0;
      }

      .header-btn {
        width: 34px;
      }

      .bubble {
        max-width: 82%;
        font-size: 14px;
      }

      .messages {
        padding-left: 10px;
        padding-right: 10px;
      }

    }

  </style>
</head>


<body>

<div class="app">


  <!-- HEADER -->

  <header class="header">

    <button
      class="back"
      onclick="location.href='index.html'"
      aria-label="Back"
    >
      ‹
    </button>


    <div class="profile">

      <div class="avatar">
        M
      </div>

      <div class="profile-info">

        <div class="profile-name">
          Mela
        </div>

        <div class="status">

          <span class="online-dot"></span>

          Online

        </div>

      </div>

    </div>


    <div class="header-actions">

      <button
        class="header-btn"
        title="Search"
      >
        ⌕
      </button>

      <button
        class="header-btn"
        title="More"
      >
        ⋯
      </button>

    </div>

  </header>


  <!-- MESSAGES -->

  <main
    class="messages"
    id="messages"
  >

    <div class="date">
      TODAY
    </div>


    <!-- MELA -->

    <div class="row them">

      <div class="bubble">

        Hey ❤️

        <span class="time">
          5:02 PM
        </span>

      </div>

    </div>


    <!-- YOU -->

    <div class="row me">

      <div class="bubble">

        Hey Mela.

        <span class="time">
          5:03 PM
        </span>

        <span class="read">
          ✓✓
        </span>

      </div>

    </div>


    <div class="row me">

      <div class="bubble">

        Welcome to our little world.

        <span class="time">
          5:03 PM
        </span>

        <span class="read">
          ✓✓
        </span>

      </div>

    </div>


    <!-- TYPING -->

    <div
      class="typing-row"
      id="typing"
    >

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

    </div>

  </main>


  <!-- EMOJI PANEL -->

  <div
    class="emoji-panel"
    id="emojiPanel"
  >

    <button>❤️</button>
    <button>😂</button>
    <button>🥹</button>
    <button>😘</button>
    <button>😍</button>
    <button>😭</button>
    <button>🤍</button>
    <button>💕</button>
    <button>🫶</button>
    <button>😊</button>

  </div>


  <!-- COMPOSER -->

  <div class="composer-area">

    <form
      class="composer"
      id="chatForm"
    >

      <button
        class="attach"
        type="button"
        title="Attach"
      >
        ＋
      </button>


      <div class="input-box">

        <input
          id="messageInput"
          type="text"
          placeholder="Message Mela..."
          autocomplete="off"
          maxlength="2000"
        >

        <button
          class="emoji"
          type="button"
          id="emojiBtn"
        >
          ☺
        </button>

      </div>


      <button
        class="send"
        type="submit"
        aria-label="Send"
      >
        ↑
      </button>

    </form>

  </div>

</div>


<script>

  const form =
    document.getElementById("chatForm");

  const input =
    document.getElementById("messageInput");

  const messages =
    document.getElementById("messages");

  const emojiBtn =
    document.getElementById("emojiBtn");

  const emojiPanel =
    document.getElementById("emojiPanel");


  /* TIME */

  function getTime() {

    return new Date().toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }


  /* ADD MESSAGE */

  function addMessage(text) {

    const row =
      document.createElement("div");

    row.className =
      "row me";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    const textNode =
      document.createTextNode(text);


    const time =
      document.createElement("span");

    time.className =
      "time";

    time.textContent =
      getTime();


    const read =
      document.createElement("span");

    read.className =
      "read";

    read.textContent =
      "✓✓";


    bubble.appendChild(textNode);

    bubble.appendChild(time);

    bubble.appendChild(read);

    row.appendChild(bubble);

    messages.appendChild(row);


    messages.scrollTo({

      top: messages.scrollHeight,

      behavior: "smooth"

    });

  }


  /* SEND */

  form.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();

      const text =
        input.value.trim();

      if (!text) return;

      addMessage(text);

      input.value = "";

      input.focus();

    }
  );


  /* ENTER */

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        form.requestSubmit();

      }

    }
  );


  /* EMOJI */

  emojiBtn.addEventListener(
    "click",
    function() {

      emojiPanel.classList.toggle("show");

    }
  );


  document
    .querySelectorAll(".emoji-panel button")
    .forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          input.value += button.textContent;

          input.focus();

          emojiPanel.classList.remove("show");

        }
      );

    });


  /* CLOSE EMOJI PANEL */

  document.addEventListener(
    "click",
    function(event) {

      if (
        !emojiPanel.contains(event.target) &&
        event.target !== emojiBtn
      ) {

        emojiPanel.classList.remove("show");

      }

    }
  );


  /* START AT BOTTOM */

  messages.scrollTop =
    messages.scrollHeight;

</script>

</body>

</html>
