<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tattoo — Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0d0b10;
      --panel: #17131b;
      --panel-soft: #211a23;
      --bubble-me: #e9a8c4;
      --bubble-them: #28212b;
      --text: #f8f2f5;
      --muted: #b9adb5;
      --accent: #e9a8c4;
      --line: rgba(255,255,255,.10);
      --shadow: rgba(0,0,0,.40);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(233,168,196,.12),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      height: 74px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 10px 16px;

      background: rgba(23,19,27,.96);
      border-bottom: 1px solid var(--line);

      box-shadow: 0 5px 20px var(--shadow);

      z-index: 20;
    }

    .back-btn,
    .header-btn {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: rgba(255,255,255,.07);
      color: var(--text);

      display: grid;
      place-items: center;

      font-size: 20px;

      transition: .2s;
    }

    .back-btn:hover,
    .header-btn:hover {
      background: rgba(233,168,196,.18);
    }

    .profile {
      flex: 1;

      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;

      cursor: pointer;
    }

    .avatar {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #e9a8c4,
          #b87599
        );

      color: #24151e;

      font-weight: bold;
      font-size: 19px;

      box-shadow:
        0 4px 16px
        rgba(233,168,196,.25);
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      font-size: 16px;
      font-weight: bold;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 16px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7d737b;
      box-shadow: 0 0 0 2px rgba(255,255,255,.04);
      flex-shrink: 0;
    }

    .status.online {
      color: #b8e6c8;
    }

    .status.online .status-dot {
      background: #65d391;
      box-shadow: 0 0 0 2px rgba(101,211,145,.12), 0 0 8px rgba(101,211,145,.55);
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    /* MESSAGES */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding:
        20px
        14px
        180px;

      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background:
        rgba(233,168,196,.25);
      border-radius: 20px;
    }

    .date-divider {
      text-align: center;

      color: var(--muted);

      font-size: 11px;

      letter-spacing: 1px;

      margin:
        6px 0 20px;
    }

    .row {
      display: flex;
      margin: 7px 0;

      animation:
        appear .18s ease;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.them {
      justify-content: flex-start;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform:
          translateY(5px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }

    .message-wrap {
      max-width:
        min(78%, 520px);
    }

    .bubble {
      padding:
        10px 13px;

      border-radius: 20px;

      line-height: 1.45;

      font-size: 15px;

      word-wrap: break-word;
      overflow-wrap: anywhere;

      box-shadow:
        0 4px 12px
        rgba(0,0,0,.15);
    }

    .me .bubble {
      background:
        var(--bubble-me);

      color: #2a1720;

      border-bottom-right-radius:
        7px;
    }

    .them .bubble {
      background:
        var(--bubble-them);

      color: var(--text);

      border-bottom-left-radius:
        7px;

      border:
        1px solid var(--line);
    }

    .message-meta {
      display: flex;

      align-items: center;

      gap: 5px;

      margin-top: 4px;

      padding:
        0 5px;

      color: var(--muted);

      font-size: 10px;
    }

    .me .message-meta {
      justify-content:
        flex-end;
    }

    .checks {
      letter-spacing: -2px;
      color: var(--muted);
    }

    .checks.read {
      color: #9fd5ff;
    }

    .media {
      max-width: 100%;
      max-height: 340px;

      border-radius: 15px;

      display: block;

      margin-bottom: 5px;
    }

    .file-caption {
      margin-top: 6px;
    }

    /* TYPING */

    .typing {
      display: none;

      padding:
        0 18px 8px;

      color: var(--muted);

      font-size: 12px;
    }

    .typing.show {
      display: block;
    }

    .typing-dots {
      display: inline-flex;

      gap: 3px;

      margin-left: 3px;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;

      border-radius: 50%;

      background:
        var(--accent);

      animation:
        dot 1s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay:
        .15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay:
        .3s;
    }

    @keyframes dot {
      0%,100% {
        opacity: .3;
        transform:
          translateY(0);
      }

      50% {
        opacity: 1;
        transform:
          translateY(-2px);
      }
    }

    /* NAVIGATION */

    .page-nav {
      position: fixed;

      left: 50%;
      bottom: 76px;

      transform:
        translateX(-50%);

      z-index: 25;

      display: flex;

      align-items: center;

      gap: 5px;

      padding: 6px;

      background:
        rgba(23,19,27,.96);

      border:
        1px solid var(--line);

      border-radius: 22px;

      box-shadow:
        0 8px 25px
        var(--shadow);

      backdrop-filter:
        blur(12px);
    }

    .page-nav a {
      text-decoration: none;

      color: var(--muted);

      padding:
        8px 12px;

      border-radius: 17px;

      font-size: 12px;

      white-space: nowrap;

      transition: .2s;
    }

    .page-nav a:hover,
    .page-nav a.active {
      background:
        rgba(233,168,196,.16);

      color:
        var(--accent);
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        8px 10px
        calc(
          8px +
          env(safe-area-inset-bottom)
        );

      background:
        linear-gradient(
          to top,
          rgba(13,11,16,1),
          rgba(13,11,16,.95)
        );

      z-index: 20;
    }

    .composer {
      max-width: 900px;

      margin: auto;

      display: flex;

      align-items: center;

      gap: 7px;

      padding: 7px;

      background:
        var(--panel);

      border:
        1px solid var(--line);

      border-radius: 28px;

      box-shadow:
        0 7px 25px
        var(--shadow);
    }

    .composer-btn {
      width: 38px;
      height: 38px;

      flex-shrink: 0;

      border-radius: 50%;

      background:
        transparent;

      color: var(--muted);

      font-size: 20px;

      display: grid;
      place-items: center;
    }

    .composer-btn:hover {
      color:
        var(--accent);

      background:
        rgba(233,168,196,.10);
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      border: 0;
      outline: 0;

      background:
        transparent;

      color:
        var(--text);

      padding:
        8px 2px;

      font-size: 15px;
    }

    #messageInput::placeholder {
      color:
        #887c85;
    }

    .send-btn {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      border-radius: 50%;

      background:
        var(--accent);

      color:
        #281720;

      font-size: 18px;

      display: grid;
      place-items: center;

      transition: .2s;
    }

    .send-btn:hover {
      transform:
        scale(1.05);
    }

    /* EMOJI */

    .emoji-panel {
      position: fixed;

      left: 10px;
      right: 10px;
      bottom: 132px;

      max-width: 900px;

      margin: auto;

      display: none;

      padding: 12px;

      background:
        var(--panel);

      border:
        1px solid var(--line);

      border-radius: 18px;

      box-shadow:
        0 10px 35px
        var(--shadow);

      z-index: 30;
    }

    .emoji-panel.show {
      display: block;
    }

    .emoji-grid {
      display: grid;

      grid-template-columns:
        repeat(8,1fr);

      gap: 5px;
    }

    .emoji {
      background:
        transparent;

      color:
        white;

      font-size: 23px;

      padding: 5px;

      border-radius: 10px;
    }

    .emoji:hover {
      background:
        rgba(233,168,196,.12);
    }

    /* POPUPS */

    .overlay {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.62);

      z-index: 100;
    }

    .overlay.show {
      display: flex;
    }

    .popup {
      width:
        min(430px,100%);

      background:
        var(--panel);

      border:
        1px solid var(--line);

      border-radius: 22px;

      padding: 20px;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.5);
    }

    .popup h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .popup p {
      color:
        var(--muted);

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 15px;
    }

    .popup input {
      width: 100%;

      padding:
        12px 14px;

      border-radius: 13px;

      border:
        1px solid var(--line);

      outline: none;

      background:
        var(--panel-soft);

      color:
        white;
    }

    .popup-actions {
      display: flex;

      gap: 8px;

      margin-top: 15px;
    }

    .popup-actions button {
      flex: 1;

      padding: 11px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.07);

      color:
        white;
    }

    .popup-actions .primary {
      background:
        var(--accent);

      color:
        #291720;
    }

    .menu-list {
      display: grid;
      gap: 8px;
    }

    .menu-item {
      width: 100%;

      text-align: left;

      padding: 13px;

      border-radius: 13px;

      background:
        rgba(255,255,255,.06);

      color:
        white;
    }

    .menu-item:hover {
      background:
        rgba(233,168,196,.13);
    }

    /* IDENTITY */

    .identity-options {
      display: grid;

      gap: 10px;

      margin-top: 15px;
    }

    .identity-option {
      padding: 15px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.06);

      color:
        white;

      text-align: left;

      border:
        1px solid transparent;
    }

    .identity-option:hover {
      border-color:
        rgba(233,168,196,.45);
    }

    /* JUMP */

    .jump-btn {
      position: fixed;

      right: 15px;
      bottom: 130px;

      width: 40px;
      height: 40px;

      border-radius: 50%;

      background:
        var(--panel);

      color:
        var(--accent);

      border:
        1px solid var(--line);

      display: none;

      z-index: 15;
    }

    .jump-btn.show {
      display: grid;

      place-items: center;
    }

    /* ATTACHMENT */

    .attachment-preview {
      display: none;

      max-width: 900px;

      margin:
        0 auto 6px;

      padding:
        7px 12px;

      background:
        var(--panel);

      border:
        1px solid var(--line);

      border-radius: 15px;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }

    .attachment-preview.show {
      display: flex;
    }

    .attachment-name {
      min-width: 0;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      color:
        var(--muted);

      font-size: 12px;
    }

    .remove-attachment {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.08);

      color:
        white;
    }

    @media (max-width:600px) {

      .header {
        height: 68px;
        padding: 8px 10px;
      }

      .header-btn,
      .back-btn {
        width: 38px;
        height: 38px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .header-actions {
        gap: 2px;
      }

      .message-wrap {
        max-width: 84%;
      }

      .bubble {
        font-size: 14px;
      }

      .emoji-grid {
        grid-template-columns:
          repeat(7,1fr);
      }

      .page-nav {
        bottom: 76px;

        max-width:
          calc(100% - 20px);
      }

      .page-nav a {
        padding:
          7px 9px;

        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <button
        class="back-btn"
        id="backBtn"
        aria-label="Back"
      >
        ←
      </button>

      <div
        class="profile"
        id="profileBtn"
      >

        <div class="avatar">
          M
        </div>

        <div class="profile-info">

          <div class="profile-name">
            Mela
          </div>

          <div
            class="status"
            id="statusText"
          >
            <span class="status-dot" id="statusDot" aria-hidden="true"></span>
            <span id="statusLabel">Connecting...</span>
          </div>

        </div>

      </div>

      <div class="header-actions">

        <button
          class="header-btn"
          id="tattooNotificationBell"
          type="button"
          aria-label="Notifications"
          title="Notifications"
        >
          🔔
        </button>

        <button
          class="header-btn"
          id="searchBtn"
          aria-label="Search"
        >
          🔎
        </button>

        <button
          class="header-btn"
          id="moreBtn"
          aria-label="More"
        >
          ⋯
        </button>

      </div>

    </header>


    <!-- MESSAGES -->

    <main
      class="messages"
      id="messages"
    >

      <div class="date-divider">
        OUR LITTLE WORLD
      </div>

    </main>


    <!-- TYPING -->

    <div
      class="typing"
      id="typingIndicator"
    >

      Mela is typing

      <span class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
      </span>

    </div>


    <!-- PAGE NAVIGATION -->

    <nav class="page-nav">

      <a href="index.html">
        💗 Tattoo
      </a>

      <a
        href="chat.html"
        class="active"
      >
        💬 Chat
      </a>

      <a href="memories.html">
        📸 Memories
      </a>

    </nav>


    <!-- EMOJI PANEL -->

    <div
      class="emoji-panel"
      id="emojiPanel"
    >

      <div class="emoji-grid">

        <button class="emoji">❤️</button>
        <button class="emoji">💕</button>
        <button class="emoji">💗</button>
        <button class="emoji">💖</button>
        <button class="emoji">💘</button>
        <button class="emoji">💋</button>
        <button class="emoji">🥰</button>
        <button class="emoji">😍</button>

        <button class="emoji">😘</button>
        <button class="emoji">☺️</button>
        <button class="emoji">😊</button>
        <button class="emoji">😂</button>
        <button class="emoji">😭</button>
        <button class="emoji">🥹</button>
        <button class="emoji">😌</button>
        <button class="emoji">🤭</button>

        <button class="emoji">🫶🏽</button>
        <button class="emoji">🫂</button>
        <button class="emoji">💋</button>
        <button class="emoji">🌹</button>
        <button class="emoji">✨</button>
        <button class="emoji">🥺</button>
        <button class="emoji">❤️‍🔥</button>
        <button class="emoji">💞</button>

      </div>

    </div>


    <!-- JUMP -->

    <button
      class="jump-btn"
      id="jumpBtn"
      aria-label="Jump to latest"
    >
      ↓
    </button>


    <!-- ATTACHMENT PREVIEW -->

    <div
      class="attachment-preview"
      id="attachmentPreview"
    >

      <span
        class="attachment-name"
        id="attachmentName"
      ></span>

      <button
        class="remove-attachment"
        id="removeAttachment"
        type="button"
      >
        ×
      </button>

    </div>


    <!-- COMPOSER -->

    <div class="composer-area">

      <form
        class="composer"
        id="composer"
      >

        <button
          type="button"
          class="composer-btn"
          id="attachmentBtn"
          aria-label="Attach"
        >
          ＋
        </button>

        <input
          id="fileInput"
          type="file"
          accept="image/*,video/*"
          hidden
        >

        <input
          id="messageInput"
          type="text"
          autocomplete="off"
          placeholder="Write something..."
        >

        <button
          type="button"
          class="composer-btn"
          id="emojiBtn"
          aria-label="Emoji"
        >
          ☺
        </button>

        <button
          type="submit"
          class="send-btn"
          aria-label="Send"
        >
          ↑
        </button>

      </form>

    </div>

  </div>


  <!-- PROFILE POPUP -->

  <div
    class="overlay"
    id="profileOverlay"
  >

    <div class="popup">

      <h2>
        Mela 💕
      </h2>

      <p>
        This is our private little space.
        Just you and Mela.
      </p>

      <div class="popup-actions">

        <button
          id="changeIdentityBtn"
        >
          Change identity
        </button>

        <button
          class="primary"
          data-close
        >
          Close
        </button>

      </div>

    </div>

  </div>


  <!-- SEARCH POPUP -->

  <div
    class="overlay"
    id="searchOverlay"
  >

    <div class="popup">

      <h2>
        Search chat
      </h2>

      <p>
        Find something we said.
      </p>

      <input
        id="searchInput"
        type="text"
        placeholder="Search messages..."
      >

      <div class="popup-actions">

        <button
          id="runSearchBtn"
          class="primary"
        >
          Search
        </button>

        <button data-close>
          Close
        </button>

      </div>

    </div>

  </div>


  <!-- MORE POPUP -->

  <div
    class="overlay"
    id="moreOverlay"
  >

    <div class="popup">

      <h2>
        Chat options
      </h2>

      <div class="menu-list">

        <button
          class="menu-item"
          id="jumpMenuBtn"
        >
          ↓ Jump to latest
        </button>

        <button
          class="menu-item"
          id="saveChatBtn"
        >
          💾 Save conversation
        </button>

        <button
          class="menu-item"
          id="clearMessagesBtn"
        >
          🗑 Clear my messages
        </button>

        <button
          class="menu-item"
          id="changeIdentityMenuBtn"
        >
          👤 Change identity
        </button>

        <button
          class="menu-item"
          id="memoriesMenuBtn"
        >
          📸 Open Memories
        </button>

      </div>

      <div class="popup-actions">

        <button data-close>
          Close
        </button>

      </div>

    </div>

  </div>


  <!-- IDENTITY POPUP -->

  <div
    class="overlay"
    id="identityOverlay"
  >

    <div class="popup">

      <h2>
        Who are you?
      </h2>

      <p>
        Choose the identity you're using on
        this device.
      </p>

      <div class="identity-options">

        <button
          class="identity-option"
          data-identity="you"
        >
          <strong>
            Alfred
          </strong>

          <br>

          <small>
            Alfred's side of the conversation
          </small>
        </button>

        <button
          class="identity-option"
          data-identity="mela"
        >
          <strong>
            Mela
          </strong>

          <br>

          <small>
            Mela's side of the conversation
          </small>
        </button>

      </div>

    </div>

  </div>


  <script>

    /*
      ==========================================
      SUPABASE
      ==========================================
    */

    const SUPABASE_URL =
      "https://mtlesmajgaxiaebocybz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Uafnj0C-CyB8SCeGggSpyg_bR9VvgQC";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      ==========================================
      SETTINGS
      ==========================================
    */

    const ROOM_ID =
      "tattoo";

    const USER_NAMES = {
      you: "Alfred",
      mela: "Mela"
    };

    let currentUser =
      localStorage.getItem(
        "tattoo_user"
      ) || "you";

    let OTHER_USER =
      currentUser === "you"
        ? "mela"
        : "you";


    /*
      ==========================================
      ELEMENTS
      ==========================================
    */

    const messages =
      document.getElementById(
        "messages"
      );

    const composer =
      document.getElementById(
        "composer"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const typingIndicator =
      document.getElementById(
        "typingIndicator"
      );

    const statusText =
      document.getElementById(
        "statusText"
      );

    const statusLabel =
      document.getElementById(
        "statusLabel"
      );

    const statusDot =
      document.getElementById(
        "statusDot"
      );

    const emojiPanel =
      document.getElementById(
        "emojiPanel"
      );

    const fileInput =
      document.getElementById(
        "fileInput"
      );

    const attachmentPreview =
      document.getElementById(
        "attachmentPreview"
      );

    const attachmentName =
      document.getElementById(
        "attachmentName"
      );


    let selectedAttachment =
      null;


    /*
      ==========================================
      HELPERS
      ==========================================
    */

    function scrollToBottom() {

      messages.scrollTop =
        messages.scrollHeight;

    }


    function formatTime(value) {

      return new Date(
        value
      ).toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
      ==========================================
      RENDER MESSAGE
      ==========================================
    */

    function renderMessage(
      message
    ) {

      if (!message) {
        return;
      }


      /*
        Prevent duplicate rendering
      */

      if (
        document.querySelector(
          `[data-message-id="${message.id}"]`
        )
      ) {

        return;

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "row " +
        (
          message.sender_id ===
          currentUser
            ? "me"
            : "them"
        );


      row.dataset.messageId =
        message.id;


      const wrap =
        document.createElement(
          "div"
        );


      wrap.className =
        "message-wrap";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      /*
        IMAGE
      */

      if (
        message.message_type ===
        "image"
      ) {

        const image =
          document.createElement(
            "img"
          );

        image.className =
          "media";

        image.src =
          getMediaUrl(
            message.media_path
          );

        image.alt =
          "Shared photo";

        bubble.appendChild(
          image
        );

      }


      /*
        VIDEO
      */

      else if (
        message.message_type ===
        "video"
      ) {

        const video =
          document.createElement(
            "video"
          );

        video.className =
          "media";

        video.src =
          getMediaUrl(
            message.media_path
          );

        video.controls =
          true;

        video.playsInline =
          true;

        bubble.appendChild(
          video
        );

      }


      /*
        TEXT
      */

      if (message.content) {

        const text =
          document.createElement(
            "div"
          );

        text.textContent =
          message.content;

        if (
          message.message_type !==
          "text"
        ) {

          text.className =
            "file-caption";

        }

        bubble.appendChild(
          text
        );

      }


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "message-meta";


      const time =
        document.createElement(
          "span"
        );


      time.textContent =
        formatTime(
          message.created_at
        );


      meta.appendChild(
        time
      );


      /*
        READ RECEIPTS
      */

      if (
        message.sender_id ===
        currentUser
      ) {

        const checks =
          document.createElement(
            "span"
          );

        checks.className =
          "checks" +
          (
            message.read_at
              ? " read"
              : ""
          );

        checks.textContent =
          message.read_at
            ? "✓✓"
            : "✓";

        meta.appendChild(
          checks
        );

      }


      wrap.appendChild(
        bubble
      );

      wrap.appendChild(
        meta
      );

      row.appendChild(
        wrap
      );

      messages.appendChild(
        row
      );

    }


    /*
      ==========================================
      MEDIA URL
      ==========================================
    */

    function getMediaUrl(
      path
    ) {

      const {
        data
      } =
        supabaseClient
          .storage
          .from(
            "tattoo-chat-media"
          )
          .getPublicUrl(
            path
          );

      return data.publicUrl;

    }


    /*
      ==========================================
      LOAD MESSAGES
      ==========================================
    */

    async function loadMessages() {

  const {
    data,
    error
  } = await supabaseClient
    .from("chat_messages")
    .select(
      "id, room_id, sender_id, sender_name, content, message_type, media_path, created_at, read_at"
    )
    .eq("room_id", ROOM_ID)
    .order("created_at", {
      ascending: true
    })
    .limit(100);

  if (error) {
    console.error(
      "Load messages error:",
      error
    );
    return;
  }

  messages
    .querySelectorAll(".row")
    .forEach(row => row.remove());

  data.forEach(message => {
    renderMessage(message);
  });

  requestAnimationFrame(() => {
    scrollToBottom();
  });

  markMessagesRead();

}


    /*
      ==========================================
      SEND TEXT
      ==========================================
    */

    async function sendText() {

  const text = messageInput.value.trim();

  if (!text) {
    return;
  }

  stopTyping();

  const {
    error
  } = await supabaseClient
    .from("chat_messages")
    .insert({
      room_id: ROOM_ID,
      sender_id: currentUser,
      sender_name: USER_NAMES[currentUser],
      content: text,
      message_type: "text"
    });

  if (error) {

    console.error("Send error:", error);

    alert(
      "Send error: " +
      error.message
    );

    return;
  }

  // Notify the other partner after the message is stored.
  try {
    const notificationUrl = "https://mtlesmajgaxiaebocybz.supabase.co/functions/v1/tattoo-push-v2";
    await fetch(notificationUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "notify",
        target_user: currentUser === "mela" ? "you" : "mela",
        event: "message",
        record: { sender_name: USER_NAMES[currentUser], content: text }
      })
    });
  } catch (notificationError) {
    console.warn("Message notification failed:", notificationError);
  }

  // Only clear after successful send
  messageInput.value = "";

}

    /*
      ==========================================
      SEND ATTACHMENT
      ==========================================
    */

    async function sendText() {

  const text = messageInput.value.trim();

  if (!text) {
    return;
  }

  stopTyping();

  const {
    error
  } = await supabaseClient
    .from("chat_messages")
    .insert({
      room_id: ROOM_ID,
      sender_id: currentUser,
      sender_name: USER_NAMES[currentUser],
      content: text,
      message_type: "text"
    });

  if (error) {
    console.error("Send error:", error);

    alert(
      "Send error: " +
      error.message
    );

    return;
  }

  messageInput.value = "";
}


    /*
      ==========================================
      COMPOSER
      ==========================================
    */

    composer.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        if (selectedAttachment) {

          await sendAttachment();

        } else {

          await sendText();

        }

      }
    );


    /*
      ==========================================
      ATTACHMENT
      ==========================================
    */

    document
      .getElementById(
        "attachmentBtn"
      )
      .addEventListener(
        "click",
        () => {

          fileInput.click();

        }
      );


    fileInput.addEventListener(
      "change",
      () => {

        const file =
          fileInput.files[0];


        if (!file) {
          return;
        }


        selectedAttachment =
          file;


        attachmentName.textContent =
          file.name;


        attachmentPreview.classList.add(
          "show"
        );

      }
    );


    function clearAttachment() {

      selectedAttachment =
        null;

      fileInput.value =
        "";

      attachmentPreview.classList.remove(
        "show"
      );

      attachmentName.textContent =
        "";

    }


    document
      .getElementById(
        "removeAttachment"
      )
      .addEventListener(
        "click",
        clearAttachment
      );


    /*
      ==========================================
      EMOJIS
      ==========================================
    */

    document
      .getElementById(
        "emojiBtn"
      )
      .addEventListener(
        "click",
        () => {

          emojiPanel.classList.toggle(
            "show"
          );

        }
      );


    document
      .querySelectorAll(
        ".emoji"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              messageInput.value +=
                button.textContent;

              messageInput.focus();

            }
          );

        }
      );


    /*
      ==========================================
      TYPING
      ==========================================
    */

    let typingTimer;


    async function trackPresence(
      typing = false
    ) {

      try {

        await presenceChannel.track({

          user_id:
            currentUser,

          display_name:
            USER_NAMES[
              currentUser
            ],

          online:
            true,

          typing:
            typing,

          last_seen:
            new Date().toISOString()

        });

      } catch (error) {

        console.error(
          "Presence error:",
          error
        );

      }

    }


    function startTyping() {

      trackPresence(true);


      clearTimeout(
        typingTimer
      );


      typingTimer =
        setTimeout(
          stopTyping,
          1200
        );

    }


    function stopTyping() {

      trackPresence(false);

    }


    messageInput.addEventListener(
      "input",
      () => {

        if (
          messageInput.value.trim()
        ) {

          startTyping();

        } else {

          stopTyping();

        }

      }
    );


    /*
      ==========================================
      PRESENCE
      ==========================================
    */

    const presenceChannel =
      supabaseClient.channel(
        "tattoo-presence",
        {
          config: {
            presence: {
              key:
                currentUser
            }
          }
        }
      );


    function updatePresence() {

      const state =
        presenceChannel
          .presenceState();


      let online =
        false;

      let typing =
        false;


      Object.values(
        state
      )
        .flat()
        .forEach(
          item => {

            if (
              item.user_id ===
              OTHER_USER
            ) {

              if (
                item.online === true
              ) {

                online =
                  true;

              }

              if (
                item.typing === true
              ) {

                typing =
                  true;

              }

            }

          }
        );


      if (online) {

        statusLabel.textContent =
          USER_NAMES[OTHER_USER] + " is online";

        statusText.classList.add(
          "online"
        );

      } else {

        statusLabel.textContent =
          USER_NAMES[OTHER_USER] + " is offline";

        statusText.classList.remove(
          "online"
        );

      }


      typingIndicator.classList.toggle(
        "show",
        typing
      );

    }


    presenceChannel
      .on(
        "presence",
        {
          event:
            "sync"
        },
        updatePresence
      )
      .on(
        "presence",
        {
          event:
            "join"
        },
        updatePresence
      )
      .on(
        "presence",
        {
          event:
            "leave"
        },
        updatePresence
      )
      .subscribe(
        async status => {

          if (
            status ===
            "SUBSCRIBED"
          ) {

            await trackPresence(
              false
            );

            updatePresence();

          }

        }
      );


    /*
      ==========================================
      REALTIME CHAT
      ==========================================
    */

    const chatChannel =
      supabaseClient
        .channel(
          "tattoo-chat-room"
        )

        .on(
          "postgres_changes",
          {
            event:
              "INSERT",

            schema:
              "public",

            table:
              "chat_messages",

            filter:
              "room_id=eq.tattoo"

          },

          payload => {

            const message =
              payload.new;


            /*
              Duplicate protection
            */

            if (
              document.querySelector(
                `[data-message-id="${message.id}"]`
              )
            ) {

              return;

            }


            renderMessage(
              message
            );


            scrollToBottom();


            if (
              message.sender_id !==
              currentUser
            ) {

              markMessagesRead();

            }

          }
        )

        .on(
  "postgres_changes",
  {
    event:
      "UPDATE",

    schema:
      "public",

    table:
      "chat_messages",

    filter:
      "room_id=eq.tattoo"

  },

  payload => {

    const message =
      payload.new;

    const row =
      document.querySelector(
        `[data-message-id="${message.id}"]`
      );

    if (!row) {
      return;
    }

    const checks =
      row.querySelector(
        ".checks"
      );

    if (!checks) {
      return;
    }

    if (message.read_at) {

      checks.textContent =
        "✓✓";

      checks.classList.add(
        "read"
      );

    }

  }
)

        .subscribe(
          status => {

            console.log(
              "Chat realtime:",
              status
            );

          }
        );


    /*
      ==========================================
      READ RECEIPTS
      ==========================================
    */

    async function markMessagesRead() {

      await supabaseClient
        .from(
          "chat_messages"
        )
        .update({

          read_at:
            new Date().toISOString()

        })
        .eq(
          "room_id",
          ROOM_ID
        )
        .neq(
          "sender_id",
          currentUser
        )
        .is(
          "read_at",
          null
        );

    }


    /*
      ==========================================
      SEARCH
      ==========================================
    */

    const searchOverlay =
      document.getElementById(
        "searchOverlay"
      );


    document
      .getElementById(
        "searchBtn"
      )
      .addEventListener(
        "click",
        () => {

          searchOverlay.classList.add(
            "show"
          );

          document
            .getElementById(
              "searchInput"
            )
            .focus();

        }
      );


    document
      .getElementById(
        "runSearchBtn"
      )
      .addEventListener(
        "click",
        () => {

          const query =
            document
              .getElementById(
                "searchInput"
              )
              .value
              .trim()
              .toLowerCase();


          document
            .querySelectorAll(
              ".row"
            )
            .forEach(
              row => {

                const text =
                  row.textContent
                    .toLowerCase();


                row.style.display =
                  !query ||
                  text.includes(
                    query
                  )
                    ? ""
                    : "none";

              }
            );


          searchOverlay.classList.remove(
            "show"
          );

        }
      );


    /*
      ==========================================
      SAVE CONVERSATION
      ==========================================
    */

    async function saveConversation() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "chat_messages"
          )
          .select("*")
          .eq(
            "room_id",
            ROOM_ID
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        alert(
          "Could not save chat: " +
          error.message
        );

        return;

      }


      const text =
        data
          .map(
            message =>
              `[${formatTime(
                message.created_at
              )}] ${
                message.sender_name
              }: ${
                message.content ||
                "[Media]"
              }`
          )
          .join("\n");


      const blob =
        new Blob(
          [text],
          {
            type:
              "text/plain"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;

      link.download =
        "tattoo-chat.txt";

      link.click();


      URL.revokeObjectURL(
        url
      );

    }


    /*
      ==========================================
      CLEAR MY MESSAGES
      ==========================================
    */

    async function clearMyMessages() {

      const confirmed =
        confirm(
          "Delete all messages sent by you?"
        );


      if (!confirmed) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from(
            "chat_messages"
          )
          .delete()
          .eq(
            "room_id",
            ROOM_ID
          )
          .eq(
            "sender_id",
            currentUser
          );


      if (error) {

        alert(
          "Could not clear messages: " +
          error.message
        );

        return;

      }


      await loadMessages();

    }


    /*
      ==========================================
      MORE MENU
      ==========================================
    */

    const moreOverlay =
      document.getElementById(
        "moreOverlay"
      );


    document
      .getElementById(
        "moreBtn"
      )
      .addEventListener(
        "click",
        () => {

          moreOverlay.classList.add(
            "show"
          );

        }
      );


    document
      .getElementById(
        "jumpMenuBtn"
      )
      .addEventListener(
        "click",
        () => {

          scrollToBottom();

          moreOverlay.classList.remove(
            "show"
          );

        }
      );


    document
      .getElementById(
        "saveChatBtn"
      )
      .addEventListener(
        "click",
        async () => {

          moreOverlay.classList.remove(
            "show"
          );

          await saveConversation();

        }
      );


    document
      .getElementById(
        "clearMessagesBtn"
      )
      .addEventListener(
        "click",
        async () => {

          moreOverlay.classList.remove(
            "show"
          );

          await clearMyMessages();

        }
      );


    /*
      ==========================================
      MEMORIES BUTTON
      ==========================================
    */

    document
      .getElementById(
        "memoriesMenuBtn"
      )
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "memories.html";

        }
      );


    /*
      ==========================================
      PROFILE
      ==========================================
    */

    const profileOverlay =
      document.getElementById(
        "profileOverlay"
      );


    document
      .getElementById(
        "profileBtn"
      )
      .addEventListener(
        "click",
        () => {

          profileOverlay.classList.add(
            "show"
          );

        }
      );


    /*
      ==========================================
      IDENTITY
      ==========================================
    */

    const identityOverlay =
      document.getElementById(
        "identityOverlay"
      );


    function openIdentity() {

      identityOverlay.classList.add(
        "show"
      );

    }


    document
      .getElementById(
        "changeIdentityBtn"
      )
      .addEventListener(
        "click",
        () => {

          profileOverlay.classList.remove(
            "show"
          );

          openIdentity();

        }
      );


    document
      .getElementById(
        "changeIdentityMenuBtn"
      )
      .addEventListener(
        "click",
        () => {

          moreOverlay.classList.remove(
            "show"
          );

          openIdentity();

        }
      );


    document
      .querySelectorAll(
        ".identity-option"
      )
      .forEach(
        option => {

          option.addEventListener(
            "click",
            () => {

              currentUser =
                option.dataset.identity;


              localStorage.setItem(
                "tattoo_user",
                currentUser
              );
              localStorage.setItem(
                "tattooUser",
                currentUser
              );


              OTHER_USER =
                currentUser ===
                "you"
                  ? "mela"
                  : "you";


              location.reload();

            }
          );

        }
      );


    /*
      ==========================================
      BACK BUTTON
      ==========================================
    */

    document
      .getElementById(
        "backBtn"
      )
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "index.html";

        }
      );


    /*
      ==========================================
      JUMP BUTTON
      ==========================================
    */

    const jumpBtn =
      document.getElementById(
        "jumpBtn"
      );


    messages.addEventListener(
      "scroll",
      () => {

        const distance =
          messages.scrollHeight -
          messages.scrollTop -
          messages.clientHeight;


        jumpBtn.classList.toggle(
          "show",
          distance > 500
        );

      }
    );


    jumpBtn.addEventListener(
      "click",
      scrollToBottom
    );


    /*
      ==========================================
      CLOSE POPUPS
      ==========================================
    */

    document
      .querySelectorAll(
        "[data-close]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              button
                .closest(
                  ".overlay"
                )
                .classList.remove(
                  "show"
                );

            }
          );

        }
      );


    document
      .querySelectorAll(
        ".overlay"
      )
      .forEach(
        overlay => {

          overlay.addEventListener(
            "click",
            event => {

              if (
                event.target ===
                overlay
              ) {

                overlay.classList.remove(
                  "show"
                );

              }

            }
          );

        }
      );


    /*
      ==========================================
      ESCAPE
      ==========================================
    */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          document
            .querySelectorAll(
              ".overlay"
            )
            .forEach(
              overlay =>
                overlay.classList.remove(
                  "show"
                )
            );


          emojiPanel.classList.remove(
            "show"
          );

        }

      }
    );


    /*
      ==========================================
      ENTER TO SEND
      ==========================================
    */

    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          composer.requestSubmit();

        }

      }
    );


    /*
      ==========================================
      START CHAT
      ==========================================
    */

    loadMessages();

  </script>

  <script src="notifications.js"></script>
</body>
</html>
