<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tattoo — Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0d0b10;
      --panel: #17131b;
      --panel-soft: #211a23;
      --bubble-me: #e9a8c4;
      --bubble-them: #28212b;
      --text: #f8f2f5;
      --muted: #b9adb5;
      --accent: #e9a8c4;
      --line: rgba(255,255,255,.10);
      --shadow: rgba(0,0,0,.40);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(233,168,196,.12),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      height: 74px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(23,19,27,.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 5px 20px var(--shadow);
      z-index: 10;
    }

    .back-btn,
    .header-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: .2s;
    }

    .back-btn:hover,
    .header-btn:hover {
      background: rgba(233,168,196,.18);
    }

    .profile {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          135deg,
          #e9a8c4,
          #b87599
        );
      color: #24151e;
      font-weight: bold;
      font-size: 19px;
      box-shadow: 0 4px 16px rgba(233,168,196,.25);
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      font-size: 16px;
      font-weight: bold;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .status.online {
      color: #b8e6c8;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    /* CHAT */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 110px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(233,168,196,.25);
      border-radius: 20px;
    }

    .date-divider {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      margin: 6px 0 20px;
    }

    .row {
      display: flex;
      margin: 7px 0;
      animation: appear .18s ease;
    }

    .row.me {
      justify-content: flex-end;
    }

    .row.them {
      justify-content: flex-start;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-wrap {
      max-width: min(78%, 520px);
    }

    .bubble {
      padding: 10px 13px;
      border-radius: 20px;
      line-height: 1.45;
      font-size: 15px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    .me .bubble {
      background: var(--bubble-me);
      color: #2a1720;
      border-bottom-right-radius: 7px;
    }

    .them .bubble {
      background: var(--bubble-them);
      color: var(--text);
      border-bottom-left-radius: 7px;
      border: 1px solid var(--line);
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      padding: 0 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .me .message-meta {
      justify-content: flex-end;
    }

    .checks {
      letter-spacing: -2px;
      color: var(--muted);
    }

    .checks.read {
      color: #9fd5ff;
    }

    .media {
      max-width: 100%;
      max-height: 340px;
      border-radius: 15px;
      display: block;
      margin-bottom: 5px;
    }

    .file-caption {
      margin-top: 6px;
    }

    /* TYPING */

    .typing {
      display: none;
      padding: 0 18px 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .typing.show {
      display: block;
    }

    .typing-dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 3px;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: dot 1s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes dot {
      0%,100% {
        opacity: .3;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding:
        8px 10px
        calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(
        to top,
        rgba(13,11,16,1),
        rgba(13,11,16,.95)
      );
      z-index: 20;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 7px 25px var(--shadow);
    }

    .composer-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      display: grid;
      place-items: center;
    }

    .composer-btn:hover {
      color: var(--accent);
      background: rgba(233,168,196,.10);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 8px 2px;
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #887c85;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #281720;
      font-size: 18px;
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    /* EMOJI */

    .emoji-panel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 70px;
      max-width: 900px;
      margin: auto;
      display: none;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 35px var(--shadow);
      z-index: 30;
    }

    .emoji-panel.show {
      display: block;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .emoji {
      background: transparent;
      color: white;
      font-size: 23px;
      padding: 5px;
      border-radius: 10px;
    }

    .emoji:hover {
      background: rgba(233,168,196,.12);
    }

    /* POPUPS */

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.62);
      z-index: 100;
    }

    .overlay.show {
      display: flex;
    }

    .popup {
      width: min(430px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.5);
    }

    .popup h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .popup p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .popup input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 13px;
      border: 1px solid var(--line);
      outline: none;
      background: var(--panel-soft);
      color: white;
    }

    .popup-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .popup-actions button {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      color: white;
    }

    .popup-actions .primary {
      background: var(--accent);
      color: #291720;
    }

    .menu-list {
      display: grid;
      gap: 8px;
    }

    .menu-item {
      width: 100%;
      text-align: left;
      padding: 13px;
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      color: white;
    }

    .menu-item:hover {
      background: rgba(233,168,196,.13);
    }

    /* IDENTITY */

    .identity-options {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .identity-option {
      padding: 15px;
      border-radius: 15px;
      background: rgba(255,255,255,.06);
      color: white;
      text-align: left;
      border: 1px solid transparent;
    }

    .identity-option:hover {
      border-color: rgba(233,168,196,.45);
    }

    /* JUMP */

    .jump-btn {
      position: fixed;
      right: 15px;
      bottom: 82px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--panel);
      color: var(--accent);
      border: 1px solid var(--line);
      display: none;
      z-index: 15;
    }

    .jump-btn.show {
      display: grid;
      place-items: center;
    }

    /* ATTACHMENT PREVIEW */

    .attachment-preview {
      display: none;
      max-width: 900px;
      margin: 0 auto 6px;
      padding: 7px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .attachment-preview.show {
      display: flex;
    }

    .attachment-name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 12px;
    }

    .remove-attachment {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: white;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .header {
        height: 68px;
        padding: 8px 10px;
      }

      .header-btn,
      .back-btn {
        width: 38px;
        height: 38px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .header-actions {
        gap: 2px;
      }

      .message-wrap {
        max-width: 84%;
      }

      .bubble {
        font-size: 14px;
      }

      .emoji-grid {
        grid-template-columns: repeat(7, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <button
      class="back-btn"
      id="backBtn"
      aria-label="Back"
    >
      ←
    </button>

    <div

        >
          Offline

      </div>
    </div>

    <div class="header-actions">

      <button
        class="header-btn"
        id="searchBtn"
        aria-label="Search"
      >
        🔍
      </button>

      <button
        class="header-btn"
        id="moreBtn"

        ⋯
      </button>

    </div>

  </header>

  <!-- MESSAGES -->

  <main

    id="messages"

    <div class="date-divider">

  </main>

  <!-- TYPING -->

  <div
    class="typing"
    id="typingIndicator"
  >
    Mela is typing
    <span class="typing-dots">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </div>

</div>

<!-- JUMP TO LATEST -->

<button
  class="jump-btn"
  id="jumpBtn"
>
  ↓
</button>

<!-- EMOJI PANEL -->

<div
  class="emoji-panel"
  id="emojiPanel"
>
  <div class="emoji-grid">

    <button class="emoji">❤️</button>

    <button class="emoji">😍</button>
    <button class="emoji">😘</button>

    <button class="emoji">💗</button>
    <button class="emoji">💖</button>
    <button class="emoji">💋</button>

    <button class="emoji">😂</button>
    <button class="emoji">😭</button>
    <button class="emoji">🤣</button>
    <button class="emoji">😊</button>
    <button class="emoji">😌</button>
    <button class="emoji">🥰</button>
    <button class="emoji">😚</button>
    <button class="emoji">🫶</button>

    <button class="emoji">😘</button>
    <button class="emoji">🤭</button>
    <button class="emoji">😏</button>
    <button class="emoji">🙈</button>
    <button class="emoji">😎</button>
    <button class="emoji">🤍</button>
    <button class="emoji">🩷</button>
    <button class="emoji">🫂</button>

  </div>
</div>

<!-- COMPOSER -->

<div class="composer-area">

  <div
    class="attachment-preview"
    id="attachmentPreview"
  >
    <span
      class="attachment-name"
      id="attachmentName"
    ></span>

    <button
      class="remove-attachment"
      id="removeAttachment"
    >
      ×
    </button>
  </div>

  <form
    class="composer"
    id="composer"
  >

    <button
      type="button"
      class="composer-btn"
      id="attachmentBtn"
      aria-label="Attach"
    >
      ＋
    </button>

    <input
      type="text"
      id="messageInput"
      autocomplete="off"
      placeholder="Message Mela..."
    >

    <button
      type="button"
      class="composer-btn"
      id="emojiBtn"
      aria-label="Emoji"
    >
      ☺
    </button>

    <button
      type="submit"
      class="send-btn"
      aria-label="Send"
    >
      ➤
    </button>

  </form>

</div>

<!-- FILE INPUT -->

<input
  type="file"
  id="fileInput"
  accept="image/*,video/*"
  hidden
>

<!-- IDENTITY POPUP -->

<div
  class="overlay"
  id="identityOverlay"
>
  <div class="popup">

    <h2>Who are you?</h2>

    <p>
      Choose your side of the conversation.
      This is only for this device.
    </p>

    <div class="identity-options">

      <button
        class="identity-option"
        data-user="you"
      >
        <strong>You</strong><br>
        <span style="color:#b9adb5">
          Your messages
        </span>
      </button>

      <button
        class="identity-option"
        data-user="mela"
      >
        <strong>Mela</strong><br>
        <span style="color:#b9adb5">
          Mela's messages
        </span>
      </button>

    </div>

  </div>
</div>

<!-- PROFILE POPUP -->

<div
  class="overlay"
  id="profileOverlay"
>
  <div class="popup">

    <h2>Mela</h2>

    <p>
      Your little corner of the world.
    </p>

    <div class="popup-actions">

      <button
        id="closeProfile"
        class="primary"
      >
        Close
      </button>

    </div>

  </div>
</div>

<!-- SEARCH POPUP -->

<div
  class="overlay"
  id="searchOverlay"
>
  <div class="popup">

    <h2>Search conversation</h2>

    <input
      id="searchInput"
      type="text"
      placeholder="Search messages..."
    >

    <div class="popup-actions">

      <button
        id="closeSearch"
      >
        Cancel
      </button>

      <button
        id="runSearch"
        class="primary"
      >
        Search
      </button>

    </div>

  </div>
</div>

<!-- MORE POPUP -->

<div
  class="overlay"
  id="moreOverlay"
>
  <div class="popup">

    <h2>Chat options</h2>

    <div class="menu-list">

      <button
        class="menu-item"
        id="saveConversation"
      >
        💾 Save conversation
      </button>

      <button
        class="menu-item"
        id="clearMyMessages"
      >
        🗑 Clear my messages
      </button>

      <button
        class="menu-item"
        id="changeIdentity"
      >
        👤 Change who I am
      </button>

      <button
        class="menu-item"
        id="closeMore"
      >
        Close
      </button>

    </div>

  </div>
</div>

<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://mtlesmajgaxiaebocybz.supabase.co";

  /*
    IMPORTANT:
    Paste your Supabase PUBLISHABLE key here.

    It should start with:

    sb_publishable_

    NEVER put a service_role or sb_secret key here.
  */

  const SUPABASE_KEY =
    "sb_publishable_Uafnj0C-CyB8SCeGggSpyg_bR9VvgQC";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     SETTINGS
  ========================================================= */

  const ROOM_ID = "tattoo";

  const BUCKET =
    "tattoo-chat-media";


  /* =========================================================
     USER IDENTITY
  ========================================================= */

  let currentUser =
    localStorage.getItem("tattoo_user");

  if (!currentUser) {
    currentUser = "you";
    localStorage.setItem(
      "tattoo_user",
      currentUser
    );
  }

  const USER_NAMES = {
    you: "You",
    mela: "Mela"
  };

  const OTHER_USER =
    currentUser === "you"
      ? "mela"
      : "you";


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const messages =
    document.getElementById("messages");

  const composer =
    document.getElementById("composer");

  const messageInput =
    document.getElementById("messageInput");

  const emojiPanel =
    document.getElementById("emojiPanel");

  const attachmentBtn =
    document.getElementById("attachmentBtn");

  const fileInput =
    document.getElementById("fileInput");

  const attachmentPreview =
    document.getElementById("attachmentPreview");

  const attachmentName =
    document.getElementById("attachmentName");

  const removeAttachment =
    document.getElementById("removeAttachment");

  const typingIndicator =
    document.getElementById("typingIndicator");

  const statusText =
    document.getElementById("statusText");

  const jumpBtn =
    document.getElementById("jumpBtn");


  /* =========================================================
     STATE
  ========================================================= */

  let selectedFile = null;

  let typingTimer = null;

  let presenceTimer = null;


  /* =========================================================
     HELPERS
  ========================================================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function formatTime(dateString) {

    const date =
      new Date(dateString);

    return date.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
  }


  function scrollToBottom() {

    requestAnimationFrame(() => {

      messages.scrollTop =
        messages.scrollHeight;

    });

  }


  function isNearBottom() {

    return (
      messages.scrollHeight -
      messages.scrollTop -
      messages.clientHeight
    ) < 180;

  }


  /* =========================================================
     RENDER MESSAGE
  ========================================================= */

  function renderMessage(message) {

    if (!message) return;

    if (
      document.querySelector(
        `[data-message-id="${message.id}"]`
      )
    ) {
      return;
    }

    const row =
      document.createElement("div");

    const mine =
      message.sender_id === currentUser;

    row.className =
      mine
        ? "row me"
        : "row them";

    row.dataset.messageId =
      message.id;

    const wrap =
      document.createElement("div");

    wrap.className =
      "message-wrap";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    /* TEXT */

    if (
      message.message_type === "text"
    ) {

      bubble.innerHTML =
        escapeHTML(
          message.content
        )
        .replaceAll(
          "\n",
          "<br>"
        );

    }


    /* IMAGE */

    else if (
      message.message_type === "image"
    ) {

      if (message.media_path) {

        const img =
          document.createElement("img");

        img.className =
          "media";

        img.src =
          message.media_path;

        img.alt =
          "Photo";

        img.loading =
          "lazy";

        bubble.appendChild(img);

      }

      if (message.content) {

        const caption =
          document.createElement("div");

        caption.className =
          "file-caption";

        caption.textContent =
          message.content;

        bubble.appendChild(
          caption
        );

      }

    }


    /* VIDEO */

    else if (
      message.message_type === "video"
    ) {

      if (message.media_path) {

        const video =
          document.createElement("video");

        video.className =
          "media";

        video.src =
          message.media_path;

        video.controls =
          true;

        video.playsInline =
          true;

        bubble.appendChild(video);

      }

      if (message.content) {

        const caption =
          document.createElement("div");

        caption.className =
          "file-caption";

        caption.textContent =
          message.content;

        bubble.appendChild(
          caption
        );

      }

    }


    /* META */

    const meta =
      document.createElement("div");

    meta.className =
      "message-meta";

    const time =
      document.createElement("span");

    time.textContent =
      formatTime(
        message.created_at
      );

    meta.appendChild(time);


    if (mine) {

      const checks =
        document.createElement("span");

      checks.className =
        "checks";

      if (message.read_at) {

        checks.classList.add(
          "read"
        );

        checks.textContent =
          "✓✓";

      } else {

        checks.textContent =
          "✓";

      }

      meta.appendChild(
        checks
      );

    }


    wrap.appendChild(
      bubble
    );

    wrap.appendChild(
      meta
    );

    row.appendChild(
      wrap
    );

    messages.appendChild(
      row
    );

  }


  /* =========================================================
     LOAD MESSAGES
  ========================================================= */

  async function loadMessages() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("chat_messages")
        .select("*")
        .eq("room_id", ROOM_ID)
        .order(
          "created_at",
          {
            ascending: true
          }
        );

    if (error) {

      console.error(
        "Load messages error:",
        error
      );

      return;

    }

    const divider =
      messages.querySelector(
        ".date-divider"
      );

    messages.innerHTML = "";

    if (divider) {

      messages.appendChild(
        divider
      );

    } else {

      const newDivider =
        document.createElement("div");

      newDivider.className =
        "date-divider";

      newDivider.textContent =
        "TODAY";

      messages.appendChild(
        newDivider
      );

    }

    (data || []).forEach(
      renderMessage
    );

    scrollToBottom();

    markMessagesRead();

  }


  /* =========================================================
     SEND TEXT
  ========================================================= */

  async function sendText() {

    const text =
      messageInput.value.trim();

    if (!text) return;

    messageInput.value = "";

    stopTyping();


    /*
      Insert only.

      We DO NOT render the message here.

      The Realtime INSERT listener below
      will receive it and render it once.

      This prevents double messages.
    */

    const {
      error
    } =
      await supabaseClient
        .from("chat_messages")
        .insert({

          room_id:
            ROOM_ID,

          sender_id:
            currentUser,

          sender_name:
            USER_NAMES[currentUser],

          content:
            text,

          message_type:
            "text"

        });

    if (error) {

      console.error(
        "Send error:",
        error
      );

      alert(
        "Send error: " +
        (
          error.message ||
          "Unknown error"
        )
      );

      messageInput.value =
        text;

    }

  }


  /* =========================================================
     UPLOAD MEDIA
  ========================================================= */

  async function sendAttachment(file) {

    if (!file) return;


    const fileExtension =
      file.name.includes(".")
        ? file.name
            .split(".")
            .pop()
            .toLowerCase()
        : "bin";


    const safeName =
      `${Date.now()}-${Math.random()
        .toString(36)
        .slice(2)}.${fileExtension}`;


    const path =
      `${currentUser}/${safeName}`;


    /*
      Supabase recommends the standard
      upload method for smaller files.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type || undefined
          }
        );


    if (error) {

      console.error(
        "Upload error:",
        error
      );

      alert(
        "Upload error: " +
        (
          error.message ||
          "Could not upload file."
        )
      );

      return;

    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from(BUCKET)
        .getPublicUrl(
          data.path
        );


    const messageType =
      file.type.startsWith("video/")
        ? "video"
        : "image";


    /*
      Again, we only insert.

      Realtime renders it once.
    */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("chat_messages")
        .insert({

          room_id:
            ROOM_ID,

          sender_id:
            currentUser,

          sender_name:
            USER_NAMES[currentUser],

          content:
            "",

          message_type:
            messageType,

          media_path:
            publicData.publicUrl

        });


    if (insertError) {

      console.error(
        "Media message error:",
        insertError
      );

      alert(
        "Message error: " +
        (
          insertError.message ||
          "Could not send media."
        )
      );

    }

  }


  /* =========================================================
     REALTIME CHAT
  ========================================================= */

  const chatChannel =
    supabaseClient
      .channel(
        "tattoo-chat-room"
      )

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "chat_messages",
          filter:
            "room_id=eq.tattoo"
        },
        payload => {

          const message =
            payload.new;


          /*
            CRITICAL DOUBLE-SEND FIX

            Our own message is already delivered
            through Realtime.

            We do NOT render it twice.
          */

          if (
            message.sender_id ===
            currentUser
          ) {

            renderMessage(
              message
            );

            scrollToBottom();

            return;

          }


          /*
            Render Mela's message.
          */

          renderMessage(
            message
          );

          scrollToBottom();

          markMessagesRead();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "chat_messages",
          filter:
            "room_id=eq.tattoo"
        },
        () => {

          /*
            Updates include read receipts.

            Reloading keeps the check marks
            accurate.
          */

          loadMessages();

        }
      )

      .subscribe(
        status => {

          console.log(
            "Realtime status:",
            status
          );

        }
      );


  /* =========================================================
     READ RECEIPTS
  ========================================================= */

  async function markMessagesRead() {

    await supabaseClient
      .from("chat_messages")
      .update({
        read_at:
          new Date().toISOString()
      })
      .eq(
        "room_id",
        ROOM_ID
      )
      .eq(
        "sender_id",
        OTHER_USER
      )
      .is(
        "read_at",
        null
      );

  }


  /* =========================================================
     PRESENCE
  ========================================================= */

  const presenceChannel =
    supabaseClient
      .channel(
        "tattoo-presence"
      );


  presenceChannel
    .on(
      "presence",
      {
        event: "sync"
      },
      () => {

        updatePresence();

      }
    )
    .on(
      "presence",
      {
        event: "join"
      },
      () => {

        updatePresence();

      }
    )
    .on(
      "presence",
      {
        event: "leave"
      },
      () => {

        updatePresence();

      }
    )
    .subscribe(
      async status => {

        if (
          status === "SUBSCRIBED"
        ) {

          await trackPresence();

        }

      }
    );


  async function trackPresence() {

    await presenceChannel.track({

      user_id:
        currentUser,

      display_name:
        USER_NAMES[currentUser],

      online:
        true,

      typing:
        false,

      last_seen:
        new Date().toISOString()

    });

  }


  function updatePresence() {

    const state =
      presenceChannel.presenceState();

    let otherOnline =
      false;

    Object.values(state)
      .flat()
      .forEach(item => {

        if (
          item.user_id ===
          OTHER_USER
        ) {

          otherOnline =
            true;

        }

      });


    if (otherOnline) {

      statusText.textContent =
        "Online";

      statusText.classList.add(
        "online"
      );

    } else {

      statusText.textContent =
        "Offline";

      statusText.classList.remove(
        "online"
      );

    }

  }


  /* =========================================================
     TYPING
  ========================================================= */

  messageInput.addEventListener(
    "input",
    async () => {

      await updateTyping(
        true
      );

      clearTimeout(
        typingTimer
      );

      typingTimer =
        setTimeout(
          () => {
            stopTyping();
          },
          1200
        );

    }
  );


  async function updateTyping(
    typing
  ) {

    try {

      await presenceChannel.track({

        user_id:
          currentUser,

        display_name:
          USER_NAMES[currentUser],

        online:
          true,

        typing:
          typing,

        last_seen:
          new Date().toISOString()

      });

    } catch (error) {

      console.error(
        "Typing presence error:",
        error
      );

    }

  }


  async function stopTyping() {

    clearTimeout(
      typingTimer
    );

    await updateTyping(
      false
    );

  }


  /* =========================================================
     LISTEN FOR MELA TYPING
  ========================================================= */

  presenceChannel.on(
    "presence",
    {
      event: "sync"
    },
    () => {

      const state =
        presenceChannel.presenceState();

      let otherTyping =
        false;

      Object.values(state)
        .flat()
        .forEach(item => {

          if (
            item.user_id ===
            OTHER_USER &&
            item.typing === true
          ) {

            otherTyping =
              true;

          }

        });


      typingIndicator.classList.toggle(
        "show",
        otherTyping
      );

    }
  );


  /* =========================================================
     COMPOSER
  ========================================================= */

  composer.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (selectedFile) {

        const file =
          selectedFile;

        clearAttachment();

        await sendAttachment(
          file
        );

        return;

      }

      await sendText();

    }
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        composer.requestSubmit();

      }

    }
  );


  /* =========================================================
     EMOJIS
  ========================================================= */

  document
    .getElementById("emojiBtn")
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        emojiPanel.classList.toggle(
          "show"
        );

      }
    );


  document
    .querySelectorAll(".emoji")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            messageInput.focus();

            messageInput.value +=
              button.textContent;

          }
        );

      }
    );


  /* =========================================================
     ATTACHMENTS
  ========================================================= */

  attachmentBtn.addEventListener(
    "click",
    () => {

      fileInput.click();

    }
  );


  fileInput.addEventListener(
    "change",
    () => {

      const file =
        fileInput.files[0];

      if (!file) return;

      selectedFile =
        file;

      attachmentName.textContent =
        file.name;

      attachmentPreview.classList.add(
        "show"
      );

    }
  );


  function clearAttachment() {

    selectedFile =
      null;

    fileInput.value =
      "";

    attachmentName.textContent =
      "";

    attachmentPreview.classList.remove(
      "show"
    );

  }


  removeAttachment.addEventListener(
    "click",
    clearAttachment
  );


  /* =========================================================
     BACK
  ========================================================= */

  document
    .getElementById("backBtn")
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "index.html";

      }
    );


  /* =========================================================
     PROFILE
  ========================================================= */

  const profileOverlay =
    document.getElementById(
      "profileOverlay"
    );

  document
    .getElementById("profileBtn")
    .addEventListener(
      "click",
      () => {

        profileOverlay.classList.add(
          "show"
        );

      }
    );


  document
    .getElementById("closeProfile")
    .addEventListener(
      "click",
      () => {

        profileOverlay.classList.remove(
          "show"
        );

      }
    );


  /* =========================================================
     SEARCH
  ========================================================= */

  const searchOverlay =
    document.getElementById(
      "searchOverlay"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  document
    .getElementById("searchBtn")
    .addEventListener(
      "click",
      () => {

        searchOverlay.classList.add(
          "show"
        );

        setTimeout(
          () => {
            searchInput.focus();
          },
          100
        );

      }
    );


  document
    .getElementById("closeSearch")
    .addEventListener(
      "click",
      () => {

        searchOverlay.classList.remove(
          "show"
        );

      }
    );


  document
    .getElementById("runSearch")
    .addEventListener(
      "click",
      () => {

        const term =
          searchInput.value
            .trim()
            .toLowerCase();

        searchOverlay.classList.remove(
          "show"
        );

        if (!term) return;

        const allRows =
          document.querySelectorAll(
            ".row"
          );

        let found =
          false;

        allRows.forEach(
          row => {

            const text =
              row.textContent
                .toLowerCase();

            row.style.outline =
              text.includes(term)
                ? "2px solid rgba(233,168,196,.7)"
                : "";

            if (
              text.includes(term)
            ) {

              found =
                true;

              row.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });

            }

          }
        );

        if (!found) {

          alert(
            "No matching message found."
          );

        }

      }
    );


  /* =========================================================
     MORE
  ========================================================= */

  const moreOverlay =
    document.getElementById(
      "moreOverlay"
    );


  document
    .getElementById("moreBtn")
    .addEventListener(
      "click",
      () => {

        moreOverlay.classList.add(
          "show"
        );

      }
    );


  document
    .getElementById("closeMore")
    .addEventListener(
      "click",
      () => {

        moreOverlay.classList.remove(
          "show"
        );

      }
    );


  /* =========================================================
     SAVE CONVERSATION
  ========================================================= */

  document
    .getElementById("saveConversation")
    .addEventListener(
      "click",
      async () => {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("chat_messages")
            .select("*")
            .eq(
              "room_id",
              ROOM_ID
            )
            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (error) {

          alert(
            "Could not save conversation."
          );

          return;

        }


        const text =
          (data || [])
            .map(message => {

              return (
                `[${formatTime(
                  message.created_at
                )}] ` +
                `${message.sender_name}: ` +
                (
                  message.content ||
                  `[${message.message_type}]`
                )
              );

            })
            .join("\n");


        const blob =
          new Blob(
            [text],
            {
              type:
                "text/plain;charset=utf-8"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );

        const link =
          document.createElement(
            "a"
          );

        link.href =
          url;

        link.download =
          "tattoo-chat.txt";

        link.click();

        URL.revokeObjectURL(
          url
        );

        moreOverlay.classList.remove(
          "show"
        );

      }
    );


  /* =========================================================
     CLEAR MY MESSAGES
  ========================================================= */

  document
    .getElementById("clearMyMessages")
    .addEventListener(
      "click",
      async () => {

        const confirmed =
          confirm(
            "Delete all your messages from this chat?"
          );

        if (!confirmed) return;


        const {
          error
        } =
          await supabaseClient
            .from("chat_messages")
            .delete()
            .eq(
              "room_id",
              ROOM_ID
            )
            .eq(
              "sender_id",
              currentUser
            );


        if (error) {

          alert(
            "Could not delete messages: " +
            error.message
          );

          return;

        }


        moreOverlay.classList.remove(
          "show"
        );

        await loadMessages();

      }
    );


  /* =========================================================
     CHANGE IDENTITY
  ========================================================= */

  const identityOverlay =
    document.getElementById(
      "identityOverlay"
    );


  document
    .getElementById("changeIdentity")
    .addEventListener(
      "click",
      () => {

        moreOverlay.classList.remove(
          "show"
        );

        identityOverlay.classList.add(
          "show"
        );

      }
    );


  document
    .querySelectorAll(
      ".identity-option"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const selected =
              button.dataset.user;

            localStorage.setItem(
              "tattoo_user",
              selected
            );

            location.reload();

          }
        );

      }
    );


  /* =========================================================
     JUMP BUTTON
  ========================================================= */

  messages.addEventListener(
    "scroll",
    () => {

      jumpBtn.classList.toggle(
        "show",
        !isNearBottom()
      );

    }
  );


  jumpBtn.addEventListener(
    "click",
    scrollToBottom
  );


  /* =========================================================
     CLOSE POPUPS WHEN CLICKING OUTSIDE
  ========================================================= */

  document
    .querySelectorAll(".overlay")
    .forEach(
      overlay => {

        overlay.addEventListener(
          "click",
          event => {

            if (
              event.target ===
              overlay
            ) {

              overlay.classList.remove(
                "show"
              );

            }

          }
        );

      }
    );


  /* =========================================================
     ESCAPE KEY
  ========================================================= */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        emojiPanel.classList.remove(
          "show"
        );

        document
          .querySelectorAll(
            ".overlay"
          )
          .forEach(
            overlay => {
              overlay.classList.remove(
                "show"
              );
            }
          );

      }

    }
  );


  /* =========================================================
     CLOSE EMOJI WHEN CLICKING OUTSIDE
  ========================================================= */

  document.addEventListener(
    "click",
    event => {

      if (
        !emojiPanel.contains(
          event.target
        ) &&
        event.target !==
          document.getElementById(
            "emojiBtn"
          )
      ) {

        emojiPanel.classList.remove(
          "show"
        );

      }

    }
  );


  /* =========================================================
     INITIAL LOAD
  ========================================================= */

  loadMessages();

  messageInput.focus();


</script>

</body>
</html>
